---
# Codacy configuration.
#
# Codacy was running with stock defaults, applying production-code rules
# uniformly — including to tests/. Recent PRs drew 8 (#41) and ~40 (#42) inline
# annotations, essentially none of them real defects, which buries anything that
# would actually matter.
#
# This narrows the provably-noisy cases only. Real analysis is untouched:
# CodeQL, Bandit over backend/, Pylint over backend/, and pytest all keep
# working exactly as before.

engines:
  bandit:
    enabled: true
    # B101 "use of assert detected" fires on every line of every test, because
    # asserts ARE pytest. Bandit targets production code; running it over the
    # test suite produces ~12 findings per PR and zero signal.
    exclude_paths:
      - "tests/**"

  pylint:
    enabled: true
    python_version: "3"
    # Test files intentionally use undocumented methods grouped in classes
    # (the test name is the description) — the house style in every existing
    # file under tests/unit/. Pylint reports each one as a missing docstring
    # or "method could be a function".
    exclude_paths:
      - "tests/**"

  prospector:
    enabled: true
    python_version: "3"
    exclude_paths:
      - "tests/**"

exclude_paths:
  # Vendored React — not ours to lint, and there is deliberately no build step.
  - "frontend/forms/**"
  # One-off corpus tooling, not part of the deployed app.
  - "scripts/ocr_*.py"
  # Generated data and harness output.
  - "data/**"
  - "tests/output/**"
