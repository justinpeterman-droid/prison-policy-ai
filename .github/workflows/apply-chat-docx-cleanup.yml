name: Apply Chat DOCX Cleanup Patch

on:
  push:
    branches:
      - fix/release-cleanup-chat
    paths:
      - .github/workflows/apply-chat-docx-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/release-cleanup-chat
          fetch-depth: 0

      - name: Apply ownership-aware cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          filler_path = Path("backend/reports/filler.py")
          filler = filler_path.read_text()
          old_return = '    return {"path": str(resolved_output_path)}\n'
          new_return = (
              '    return {\n'
              '        "path": str(resolved_output_path),\n'
              '        "temporary": output_path is None,\n'
              '    }\n'
          )
          if old_return not in filler:
              raise SystemExit("expected filler return block not found")
          filler_path.write_text(filler.replace(old_return, new_return, 1))

          reports_path = Path("backend/webapp/routes/reports.py")
          reports = reports_path.read_text()
          old_function = '''def _send_filled(metadata: dict):
              """Fill the 005 template and return it as a DOCX (or text fallback)."""
              output = fill_template(metadata)

              if output.get("text"):
                  return jsonify(
                      {
                          "format": "text",
                          "content": output["text"],
                          "message": "DOC template not available — text report returned",
                      }
                  )

              return send_file(
                  output["path"],
                  as_attachment=True,
                  download_name="Incident_Report_Form.docx",
                  mimetype="application/vnd.openxmlformats-officedocument.wordprocessingml.document",
              )
          '''
          new_function = '''def _send_filled(metadata: dict):
              """Fill the 005 template and return it as a DOCX (or text fallback)."""
              from io import BytesIO

              output = fill_template(metadata)

              if output.get("text"):
                  return jsonify(
                      {
                          "format": "text",
                          "content": output["text"],
                          "message": "DOC template not available — text report returned",
                      }
                  )

              output_path = Path(output["path"])
              temporary = output.get("temporary") is True
              try:
                  document_bytes = output_path.read_bytes()
              finally:
                  if temporary:
                      try:
                          output_path.unlink(missing_ok=True)
                      except OSError:
                          logger.warning(
                              "Could not remove generated report file",
                              exc_info=True,
                          )

              return send_file(
                  BytesIO(document_bytes),
                  as_attachment=True,
                  download_name="Incident_Report_Form.docx",
                  mimetype="application/vnd.openxmlformats-officedocument.wordprocessingml.document",
              )
          '''
          if old_function not in reports:
              raise SystemExit("expected _send_filled block not found")
          reports_path.write_text(reports.replace(old_function, new_function, 1))
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-chat-docx-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/reports/filler.py backend/webapp/routes/reports.py .github/workflows/apply-chat-docx-cleanup.yml
          git commit -m "fix(reports): clean temporary download files"
          git push origin HEAD:fix/release-cleanup-chat
