name: Apply PR88 Validator Security Fix

on:
  push:
    branches:
      - fix/pr88-codeql-findings
    paths:
      - .github/workflows/apply-pr88-validator-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security-fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/pr88-codeql-findings
          fetch-depth: 0

      - name: Replace quadratic regex with literal suffix matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/reports/report_validator.py")
          text = path.read_text(encoding="utf-8")

          anchor = 'FIRST_PERSON_TYPES = ("first_person", "disciplinary")\n'
          replacement = '''FIRST_PERSON_TYPES = ("first_person", "disciplinary")

# Literal suffixes accepted by the old RW-014 repair. Keeping this operation
# out of the regex engine prevents quadratic backtracking on long user-provided
# report text while preserving the exact case-insensitive closer semantics.
_REPAIR_STATEMENT_CLOSERS = (
    "disciplinary action taken.",
    "end of statement.",
    "end of statement",
    "end of report.",
    "end of report",
)


def _strip_statement_closer(text: str) -> str:
    candidate = text.rstrip()
    folded = candidate.casefold()
    for closer in _REPAIR_STATEMENT_CLOSERS:
        if folded.endswith(closer):
            return candidate[: -len(closer)].rstrip()
    return text
'''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one constant anchor, found {text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)

          old = '''    # RW-014: strip a statement closer (ruling 13)
    new = re.sub(
        r"\\s*(?:End of (?:report|statement)\\.?|Disciplinary action taken\\.)\\s*$",
        "",
        text,
        flags=re.I,
    )
'''
          new = '''    # RW-014: strip a statement closer (ruling 13)
    new = _strip_statement_closer(text)
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one RW-014 repair block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-pr88-validator-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/reports/report_validator.py .github/workflows/apply-pr88-validator-fix.yml
          git commit -m "fix(security): make statement-closer repair linear"
          git push origin HEAD:fix/pr88-codeql-findings
