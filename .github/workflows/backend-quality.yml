name: Backend Quality
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  backend-quality-3-12:
    name: backend-quality-3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes
      - run: python -m ruff check backend tests scripts && python -m ruff format --check backend tests scripts && python -m mypy backend
  backend-quality-3-14:
    name: backend-quality-3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes
      - run: python -m pytest tests/unit -q
  postgres-integration-17:
    runs-on: ubuntu-latest
    services:
      postgres: {image: postgres:17, env: {POSTGRES_DB: access_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes && python -m pytest tests/integration -q
  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes && python -m pytest tests/contract -q
  security-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python scripts/ci/check_sensitive_output.py --tracked
  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: terraform fmt -check -recursive infra/terraform
