name: Backend Quality
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  backend-quality-3-12:
    name: backend-quality-3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes
      - run: python -m pytest tests/unit/test_ci_release_gates.py tests/unit/test_container_contract.py tests/unit/test_web_build_contract.py -q
  backend-quality-3-14:
    name: backend-quality-3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes
      - run: python -m pytest tests/unit/test_web_app_routes.py tests/unit/test_web_build_contract.py tests/unit/test_web_csrf.py -q
  postgres-integration-17:
    runs-on: ubuntu-latest
    services:
      postgres: {image: postgres:17, env: {POSTGRES_DB: access_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}}
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/access_test
      IDENTITY_HASH_PEPPER: fictional-ci-identity-pepper-0001
      CURSOR_SIGNING_KEY: fictional-ci-cursor-signing-key-0001
      PUBLIC_BASE_URL: https://ci.example.invalid
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes && python -m pytest tests/integration/test_web_*.py -q
  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes && python -m pytest tests/contract -q
  security-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python scripts/ci/check_sensitive_output.py --tracked
  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      - run: terraform fmt -check -recursive infra/terraform
