name: Backend Quality
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  backend-quality-312:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes
      - run: python -m ruff check backend tests scripts && python -m ruff format --check backend tests scripts && python -m mypy backend
  backend-quality-314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes
      - run: python -m pytest tests/unit -q
  postgres-integration-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:e42539a54ee3e82e21f19d7eded61b579869585f86b90b5e851ff0d3dd8b4001
        env: {POSTGRES_DB: access_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d access_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/access_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes && python -m pytest tests/integration -q
  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.14"}
      - run: python -m pip install -r requirements-dev.lock --require-hashes && python -m pytest tests/contract -q
  security-redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python scripts/ci/check_sensitive_output.py --tracked
  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with: {terraform_version: "1.15.8"}
      - run: terraform fmt -check -recursive infra/terraform
      - run: >-
          docker run --rm -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/bridgecrewio/checkov@sha256:e5e308e713725e73f517e4cb85b39d467f1e047204c174fb15eb444c27ffb745
          -d /repo/infra/terraform --quiet
