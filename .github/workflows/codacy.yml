# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Supplemental Security Scan (non-authoritative)

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '26 1 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        id: codacy_scan
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        # The pinned action's SARIF formatter crashes the whole CLI process
        # (java.nio.charset.MalformedInputException) when a finding lands in
        # a file it can't re-read as UTF-8 text; .codacy.yml excludes the
        # known binary assets, but the crash has reproduced even so — likely
        # a generic tool (duplication/cloc) touching a binary file the local
        # exclude_paths doesn't reach when a project-token pulls in remote
        # config. That's an upstream CLI bug, not a repo security finding, so
        # don't let it block CI; results still upload whenever the run
        # succeeds. Note the crash leaves a truncated, invalid results.sarif
        # behind — the upload step below gates on this step's *outcome*, not
        # on the file merely existing, so it doesn't trade one failure for
        # another ("Invalid SARIF. JSON syntax error").
        env:
          # The CLI's SARIF formatter re-reads each file with a finding to quote
          # the offending line, using the JVM default charset. The runner has no
          # locale set, so that default is ASCII and any non-ASCII character in
          # an analysed file blows the whole run up:
          #
          #   java.nio.charset.MalformedInputException: Input length = 1
          #     at java.nio.file.Files.readAllLines
          #     at com.codacy.analysis.cli.formatter.Sarif.createResults
          #
          # Every text file in this repo is valid UTF-8, so pinning the JVM and
          # the locale to UTF-8 is the fix rather than stripping characters.
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Upload the SARIF file generated in the previous step. Skipped (not
      # failed) when the analysis step above crashed — its outcome is the
      # signal, since a crash can still leave a truncated results.sarif on
      # disk that would fail SARIF upload validation if we tried it anyway.
      - name: Upload SARIF results file
        if: steps.codacy_scan.outcome == 'success'
        uses: github/codeql-action/upload-sarif@e306b2ed11bcb6d30c3a02149c11f0e6aaed69a3
        with:
          sarif_file: results.sarif
