name: Container Security
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag prison-policy-ai:ci .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.1.3}
      - run: >-
          cosign verify
          --certificate-identity https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cgr.dev/chainguard/python@sha256:8fab86fb761aeb18723f4f1b1baa330bd59d64e92abdc5b980d1bbd9399c297d
      - run: >-
          cosign verify --certificate-identity-regexp '^https://github.com/anchore/(syft|grype)/'
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          docker.io/anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
      - run: >-
          cosign verify --certificate-identity-regexp '^https://github.com/anchore/(syft|grype)/'
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          docker.io/anchore/grype@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag prison-policy-ai:ci .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.1.3}
      - run: >-
          cosign verify --certificate-identity-regexp '^https://github.com/anchore/(syft|grype)/'
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          docker.io/anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          docker.io/anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
          prison-policy-ai:ci -o spdx-json=sbom.spdx.json
      - run: docker pull cgr.dev/chainguard/python@sha256:8fab86fb761aeb18723f4f1b1baa330bd59d64e92abdc5b980d1bbd9399c297d
      - run: python scripts/ci/validate_sbom.py --image prison-policy-ai:ci --runtime-image cgr.dev/chainguard/python@sha256:8fab86fb761aeb18723f4f1b1baa330bd59d64e92abdc5b980d1bbd9399c297d --output sbom.spdx.json --provenance sbom.provenance.json --generate-provenance
      - run: python scripts/ci/validate_sbom.py --image prison-policy-ai:ci --runtime-image cgr.dev/chainguard/python@sha256:8fab86fb761aeb18723f4f1b1baa330bd59d64e92abdc5b980d1bbd9399c297d --output sbom.spdx.json --provenance sbom.provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: sbom, path: "sbom.spdx.json\nsbom.provenance.json"}
  container-vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag prison-policy-ai:ci .
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with: {image: prison-policy-ai:ci, grype-version: 0.117.0, severity-cutoff: high, only-fixed: 'true', fail-build: 'true', output-format: sarif, output-file: grype.sarif}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: grype-sarif, path: grype.sarif}
  pages-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python scripts/ci/build_pages_dist.py && python scripts/ci/check_sensitive_output.py --paths pages-dist
