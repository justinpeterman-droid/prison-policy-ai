name: Container Security
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag prison-policy-ai:ci .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.1.3}
      - run: >-
          cosign verify
          --certificate-identity https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cgr.dev/chainguard/python@sha256:8fab86fb761aeb18723f4f1b1baa330bd59d64e92abdc5b980d1bbd9399c297d
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag prison-policy-ai:ci .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.1.3}
      - run: |
          mkdir -p tools/syft
          curl --fail --location --silent --show-error --output tools/syft/checksums.txt https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_checksums.txt
          curl --fail --location --silent --show-error --output tools/syft/checksums.txt.pem.b64 https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_checksums.txt.pem
          curl --fail --location --silent --show-error --output tools/syft/checksums.txt.sig https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_checksums.txt.sig
          base64 --decode tools/syft/checksums.txt.pem.b64 > tools/syft/checksums.txt.pem
          cosign verify-blob --certificate tools/syft/checksums.txt.pem --signature tools/syft/checksums.txt.sig --certificate-identity https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com tools/syft/checksums.txt
          curl --fail --location --silent --show-error --output tools/syft/syft_1.51.0_linux_amd64.tar.gz https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_linux_amd64.tar.gz
          grep -F "  syft_1.51.0_linux_amd64.tar.gz" tools/syft/checksums.txt > tools/syft/selected-checksum.txt
          test -s tools/syft/selected-checksum.txt
          (cd tools/syft && sha256sum --check --strict selected-checksum.txt)
          tar --extract --gzip --file tools/syft/syft_1.51.0_linux_amd64.tar.gz --directory tools/syft
          tools/syft/syft prison-policy-ai:ci -o spdx-json=sbom.spdx.json
      - run: docker pull cgr.dev/chainguard/python@sha256:8fab86fb761aeb18723f4f1b1baa330bd59d64e92abdc5b980d1bbd9399c297d
      - run: python scripts/ci/validate_sbom.py --image prison-policy-ai:ci --runtime-image cgr.dev/chainguard/python@sha256:8fab86fb761aeb18723f4f1b1baa330bd59d64e92abdc5b980d1bbd9399c297d --output sbom.spdx.json --provenance sbom.provenance.json --generate-provenance
      - run: python scripts/ci/validate_sbom.py --image prison-policy-ai:ci --runtime-image cgr.dev/chainguard/python@sha256:8fab86fb761aeb18723f4f1b1baa330bd59d64e92abdc5b980d1bbd9399c297d --output sbom.spdx.json --provenance sbom.provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: sbom, path: "sbom.spdx.json\nsbom.provenance.json"}
  container-vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --tag prison-policy-ai:ci .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with: {cosign-release: v3.1.3}
      - run: |
          mkdir -p tools/grype
          curl --fail --location --silent --show-error --output tools/grype/checksums.txt https://github.com/anchore/grype/releases/download/v0.117.0/grype_0.117.0_checksums.txt
          curl --fail --location --silent --show-error --output tools/grype/checksums.txt.pem.b64 https://github.com/anchore/grype/releases/download/v0.117.0/grype_0.117.0_checksums.txt.pem
          curl --fail --location --silent --show-error --output tools/grype/checksums.txt.sig https://github.com/anchore/grype/releases/download/v0.117.0/grype_0.117.0_checksums.txt.sig
          base64 --decode tools/grype/checksums.txt.pem.b64 > tools/grype/checksums.txt.pem
          cosign verify-blob --certificate tools/grype/checksums.txt.pem --signature tools/grype/checksums.txt.sig --certificate-identity https://github.com/anchore/grype/.github/workflows/release.yaml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com tools/grype/checksums.txt
          curl --fail --location --silent --show-error --output tools/grype/grype_0.117.0_linux_amd64.tar.gz https://github.com/anchore/grype/releases/download/v0.117.0/grype_0.117.0_linux_amd64.tar.gz
          grep -F "  grype_0.117.0_linux_amd64.tar.gz" tools/grype/checksums.txt > tools/grype/selected-checksum.txt
          test -s tools/grype/selected-checksum.txt
          (cd tools/grype && sha256sum --check --strict selected-checksum.txt)
          tar --extract --gzip --file tools/grype/grype_0.117.0_linux_amd64.tar.gz --directory tools/grype
          tools/grype/grype prison-policy-ai:ci --fail-on high --only-fixed -o sarif > grype.sarif
      - run: python scripts/ci/check_sensitive_output.py --paths grype.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: grype-sarif, path: grype.sarif}
  pages-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python scripts/ci/build_pages_dist.py && python scripts/ci/check_sensitive_output.py --paths pages-dist
