name: Terraform reviewed plan

on:
  workflow_call:
    inputs:
      environment: {required: true, type: string}
      terraform_root: {required: true, type: string}
      image_digest: {required: true, type: string}
      source_commit: {required: true, type: string}
      version_registry_sha256: {required: true, type: string}
      plan_purpose: {required: true, type: string}
    outputs:
      plan_workflow_run_id:
        value: ${{ jobs.plan_test.outputs.plan_workflow_run_id || jobs.plan_production.outputs.plan_workflow_run_id }}
      plan_workflow_name:
        value: ${{ jobs.plan_test.outputs.plan_workflow_name || jobs.plan_production.outputs.plan_workflow_name }}
      plan_workflow_id:
        value: ${{ jobs.plan_test.outputs.plan_workflow_id || jobs.plan_production.outputs.plan_workflow_id }}
      plan_artifact_id:
        value: ${{ jobs.plan_test.outputs.plan_artifact_id || jobs.plan_production.outputs.plan_artifact_id }}
      plan_artifact_name:
        value: ${{ jobs.plan_test.outputs.plan_artifact_name || jobs.plan_production.outputs.plan_artifact_name }}
      plan_sha256:
        value: ${{ jobs.plan_test.outputs.plan_sha256 || jobs.plan_production.outputs.plan_sha256 }}
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [test, production]
      terraform_root: {required: true, type: string}
      image_digest: {required: true, type: string}
      source_commit: {required: true, type: string}
      version_registry_sha256: {required: true, type: string}
      plan_purpose: {required: true, type: string}

permissions: {}

jobs:
  plan_test:
    if: ${{ inputs.environment == 'test' }}
    environment: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      deployments: write
    outputs:
      plan_workflow_run_id: ${{ steps.authority.outputs.plan_workflow_run_id }}
      plan_workflow_name: ${{ steps.authority.outputs.plan_workflow_name }}
      plan_workflow_id: ${{ steps.authority.outputs.plan_workflow_id }}
      plan_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      plan_artifact_name: ${{ steps.authority.outputs.plan_artifact_name }}
      plan_sha256: ${{ steps.authority.outputs.plan_sha256 }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.source_commit }}"}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with: {terraform_wrapper: false}
      - name: Validate test plan authority
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TERRAFORM_ROOT: ${{ inputs.terraform_root }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${SOURCE_COMMIT}"
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_DIGEST}" =~ @sha256:[0-9a-f]{64}$ ]]
          test "${TERRAFORM_ROOT}" = "infra/terraform/environments/test"
          python scripts/deploy/validate_release_descriptor.py version --registry release/version.json --expected-sha256 "${{ inputs.version_registry_sha256 }}"
      - name: Authenticate as test Terraform plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_PLAN_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}
      - name: Build reviewed test plan
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          terraform -chdir="${{ inputs.terraform_root }}" init -input=false
          terraform -chdir="${{ inputs.terraform_root }}" validate
          terraform -chdir="${{ inputs.terraform_root }}" test -test-directory=../../tests
          terraform -chdir="${{ inputs.terraform_root }}" plan -input=false -out="${GITHUB_WORKSPACE}/reviewed.tfplan" -var="image_digest=${{ inputs.image_digest }}" -var="source_commit=${{ inputs.source_commit }}"
          terraform -chdir="${{ inputs.terraform_root }}" show -no-color "${GITHUB_WORKSPACE}/reviewed.tfplan" > "${GITHUB_WORKSPACE}/reviewed.txt"
          python scripts/ci/check_sensitive_output.py --paths reviewed.txt
      - name: Bind plan metadata
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          VERSION_REGISTRY_SHA256: ${{ inputs.version_registry_sha256 }}
          TERRAFORM_ROOT: ${{ inputs.terraform_root }}
          PLAN_PURPOSE: ${{ inputs.plan_purpose }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-test.yml" --jq '.id')"
          plan_sha256="$(sha256sum reviewed.tfplan | cut -d' ' -f1)"
          artifact_name="tfplan-test-${SOURCE_COMMIT}-${GITHUB_RUN_ID}"
          python scripts/deploy/validate_release_descriptor.py version --registry release/version.json --expected-sha256 "${VERSION_REGISTRY_SHA256}" --github-output projection.env
          set -a
          . ./projection.env
          set +a
          export WORKFLOW_ID="${workflow_id}" PLAN_SHA256="${plan_sha256}" ARTIFACT_NAME="${artifact_name}"
          python - <<'PY'
          import json, os
          metadata = {
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "plan_workflow_name": os.environ["GITHUB_WORKFLOW"],
              "plan_workflow_id": int(os.environ["WORKFLOW_ID"]),
              "plan_workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "plan_job_workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "protected_environment": "test",
              "git_ref": os.environ["GITHUB_REF"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "version_registry_sha256": os.environ["VERSION_REGISTRY_SHA256"],
              "release_version": os.environ["RELEASE_VERSION"],
              "api_version": os.environ["API_VERSION"],
              "latest_client_version": os.environ["LATEST_CLIENT_VERSION"],
              "minimum_client_version": os.environ["MINIMUM_CLIENT_VERSION"],
              "minimum_server_version": os.environ["MINIMUM_SERVER_VERSION"],
              "release_notes": os.environ["RELEASE_NOTES"],
              "terraform_root": os.environ["TERRAFORM_ROOT"],
              "plan_purpose": os.environ["PLAN_PURPOSE"],
              "plan_sha256": os.environ["PLAN_SHA256"],
              "plan_artifact_name": os.environ["ARTIFACT_NAME"],
          }
          open("plan-metadata.json", "w", encoding="utf-8").write(json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          {
            echo "plan_workflow_run_id=${GITHUB_RUN_ID}"
            echo "plan_workflow_name=${GITHUB_WORKFLOW}"
            echo "plan_workflow_id=${workflow_id}"
            echo "plan_artifact_name=${artifact_name}"
            echo "plan_sha256=${plan_sha256}"
          } >> "${GITHUB_OUTPUT}"
      - name: Upload exact reviewed plan bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.authority.outputs.plan_artifact_name }}
          path: |
            reviewed.tfplan
            reviewed.txt
            plan-metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Record successful protected deployment receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.authority.outputs.plan_artifact_name }}
          PLAN_SHA256: ${{ steps.authority.outputs.plan_sha256 }}
          WORKFLOW_ID: ${{ steps.authority.outputs.plan_workflow_id }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "${GITHUB_SHA}" --arg env test --argjson run "${GITHUB_RUN_ID}" --argjson workflow "${WORKFLOW_ID}" --argjson artifact "${ARTIFACT_ID}" --arg name "${ARTIFACT_NAME}" --arg plan "${PLAN_SHA256}" --arg digest "${{ inputs.image_digest }}" --arg registry "${{ inputs.version_registry_sha256 }}" --arg purpose "${{ inputs.plan_purpose }}" '{ref:$ref,environment:$env,auto_merge:false,required_contexts:[],payload:{github_repository:env.GITHUB_REPOSITORY,plan_workflow_name:env.GITHUB_WORKFLOW,plan_workflow_id:$workflow,plan_workflow_run_id:$run,plan_artifact_id:$artifact,plan_artifact_name:$name,plan_sha256:$plan,source_commit:$ref,image_digest:$digest,version_registry_sha256:$registry,plan_purpose:$purpose,protected_environment:$env,git_ref:env.GITHUB_REF}}')"
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" --method POST --input - <<<"${payload}" --jq '.id')"
          jq -nc --arg state success --arg env test --arg description "Reviewed Terraform plan receipt" '{state:$state,environment:$env,description:$description,auto_inactive:false}' | gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" --method POST --input - >/dev/null

  plan_production:
    if: ${{ inputs.environment == 'production' }}
    environment: production-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      deployments: write
    outputs:
      plan_workflow_run_id: ${{ steps.authority.outputs.plan_workflow_run_id }}
      plan_workflow_name: ${{ steps.authority.outputs.plan_workflow_name }}
      plan_workflow_id: ${{ steps.authority.outputs.plan_workflow_id }}
      plan_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      plan_artifact_name: ${{ steps.authority.outputs.plan_artifact_name }}
      plan_sha256: ${{ steps.authority.outputs.plan_sha256 }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.source_commit }}"}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with: {terraform_wrapper: false}
      - name: Validate production plan authority
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TERRAFORM_ROOT: ${{ inputs.terraform_root }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${SOURCE_COMMIT}"
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_DIGEST}" =~ @sha256:[0-9a-f]{64}$ ]]
          test "${TERRAFORM_ROOT}" = "infra/terraform/environments/production"
          python scripts/deploy/validate_release_descriptor.py version --registry release/version.json --expected-sha256 "${{ inputs.version_registry_sha256 }}" --production
      - name: Authenticate as production Terraform plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_PLAN_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}
      - name: Build reviewed production plan
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          terraform -chdir="${{ inputs.terraform_root }}" init -input=false
          terraform -chdir="${{ inputs.terraform_root }}" validate
          terraform -chdir="${{ inputs.terraform_root }}" plan -input=false -out="${GITHUB_WORKSPACE}/reviewed.tfplan" -var="image_digest=${{ inputs.image_digest }}" -var="source_commit=${{ inputs.source_commit }}"
          terraform -chdir="${{ inputs.terraform_root }}" show -no-color "${GITHUB_WORKSPACE}/reviewed.tfplan" > "${GITHUB_WORKSPACE}/reviewed.txt"
          python scripts/ci/check_sensitive_output.py --paths reviewed.txt
      - name: Bind plan metadata
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          VERSION_REGISTRY_SHA256: ${{ inputs.version_registry_sha256 }}
          TERRAFORM_ROOT: ${{ inputs.terraform_root }}
          PLAN_PURPOSE: ${{ inputs.plan_purpose }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/terraform-plan.yml" --jq '.id')"
          plan_sha256="$(sha256sum reviewed.tfplan | cut -d' ' -f1)"
          artifact_name="tfplan-production-${SOURCE_COMMIT}-${GITHUB_RUN_ID}"
          python scripts/deploy/validate_release_descriptor.py version --registry release/version.json --expected-sha256 "${VERSION_REGISTRY_SHA256}" --production --github-output projection.env
          set -a
          . ./projection.env
          set +a
          export WORKFLOW_ID="${workflow_id}" PLAN_SHA256="${plan_sha256}" ARTIFACT_NAME="${artifact_name}"
          python - <<'PY'
          import json, os
          metadata = {
              "github_repository": os.environ["GITHUB_REPOSITORY"], "plan_workflow_name": os.environ["GITHUB_WORKFLOW"],
              "plan_workflow_id": int(os.environ["WORKFLOW_ID"]), "plan_workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "plan_job_workflow_ref": os.environ["GITHUB_WORKFLOW_REF"], "protected_environment": "production-plan",
              "git_ref": os.environ["GITHUB_REF"], "source_commit": os.environ["SOURCE_COMMIT"], "image_digest": os.environ["IMAGE_DIGEST"],
              "version_registry_sha256": os.environ["VERSION_REGISTRY_SHA256"], "release_version": os.environ["RELEASE_VERSION"],
              "api_version": os.environ["API_VERSION"], "latest_client_version": os.environ["LATEST_CLIENT_VERSION"],
              "minimum_client_version": os.environ["MINIMUM_CLIENT_VERSION"], "minimum_server_version": os.environ["MINIMUM_SERVER_VERSION"],
              "release_notes": os.environ["RELEASE_NOTES"], "terraform_root": os.environ["TERRAFORM_ROOT"],
              "plan_purpose": os.environ["PLAN_PURPOSE"], "plan_sha256": os.environ["PLAN_SHA256"], "plan_artifact_name": os.environ["ARTIFACT_NAME"],
          }
          open("plan-metadata.json", "w", encoding="utf-8").write(json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          {
            echo "plan_workflow_run_id=${GITHUB_RUN_ID}"
            echo "plan_workflow_name=${GITHUB_WORKFLOW}"
            echo "plan_workflow_id=${workflow_id}"
            echo "plan_artifact_name=${artifact_name}"
            echo "plan_sha256=${plan_sha256}"
          } >> "${GITHUB_OUTPUT}"
      - name: Upload exact reviewed plan bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.authority.outputs.plan_artifact_name }}
          path: |
            reviewed.tfplan
            reviewed.txt
            plan-metadata.json
          if-no-files-found: error
          retention-days: 30
      - name: Record successful protected deployment receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.authority.outputs.plan_artifact_name }}
          PLAN_SHA256: ${{ steps.authority.outputs.plan_sha256 }}
          WORKFLOW_ID: ${{ steps.authority.outputs.plan_workflow_id }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg ref "${GITHUB_SHA}" --arg env production-plan --argjson run "${GITHUB_RUN_ID}" --argjson workflow "${WORKFLOW_ID}" --argjson artifact "${ARTIFACT_ID}" --arg name "${ARTIFACT_NAME}" --arg plan "${PLAN_SHA256}" --arg digest "${{ inputs.image_digest }}" --arg registry "${{ inputs.version_registry_sha256 }}" --arg purpose "${{ inputs.plan_purpose }}" '{ref:$ref,environment:$env,auto_merge:false,required_contexts:[],payload:{github_repository:env.GITHUB_REPOSITORY,plan_workflow_name:env.GITHUB_WORKFLOW,plan_workflow_id:$workflow,plan_workflow_run_id:$run,plan_artifact_id:$artifact,plan_artifact_name:$name,plan_sha256:$plan,source_commit:$ref,image_digest:$digest,version_registry_sha256:$registry,plan_purpose:$purpose,protected_environment:$env,git_ref:env.GITHUB_REF}}')"
          deployment_id="$(gh api "repos/${GITHUB_REPOSITORY}/deployments" --method POST --input - <<<"${payload}" --jq '.id')"
          jq -nc --arg state success --arg env production-plan --arg description "Reviewed Terraform plan receipt" '{state:$state,environment:$env,description:$description,auto_inactive:false}' | gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" --method POST --input - >/dev/null
