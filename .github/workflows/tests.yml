name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only checks out code and runs tests.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: access_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d access_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/access_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run contract and browser-security tests
        run: python -m pytest tests/contract tests/security -q

      - name: Check sanitized print templates
        run: python scripts/check_print_templates.py

      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/integration -q

      # Catches a source PNG edited without regenerating its WebP, which would
      # otherwise ship the old art silently — the templates only load .webp.
      - name: Check optimized images are current
        run: python scripts/optimize_images.py --check

  web:
    name: Guided Operations Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: frontend/web
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint web source
        working-directory: frontend/web
        run: npm run lint

      - name: Typecheck web source
        working-directory: frontend/web
        run: npm run typecheck

      - name: Run web unit tests
        working-directory: frontend/web
        run: npm run test

      - name: Build web application
        working-directory: frontend/web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend/web
        run: npx playwright install --with-deps chromium

      - name: Run browser workflows
        working-directory: frontend/web
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_VISUAL_REGRESSION: "1"
