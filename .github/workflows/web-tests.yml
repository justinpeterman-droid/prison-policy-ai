name: Guided Operations Web

on:
  pull_request:
  push:
    branches:
      - "feature/guided-operations-web-foundation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run component tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build production assets
        run: npm run build
