<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found</title>
<link rel="icon" href="{{ asset_url('seal.svg') }}">
<link rel="stylesheet" href="{{ asset_url('fonts.css') }}">
<link rel="stylesheet" href="{{ asset_url('tokens.css') }}">
<style>
  :root{
    --navy:#0e1a2b;
    --text:#0f1626;--text3:#5c6675;--text4:#9096a4;
    --gold:#c9971c;
    --border-sub:rgba(16,24,40,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Open Sans','Inter',system-ui,sans-serif;color:var(--text);
    background:var(--navy);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:420px;text-align:center;
    background:#fff;border-radius:16px;padding:40px 32px 30px;
    border-top:4px solid var(--gold);
    box-shadow:0 30px 90px -12px rgba(0,0,0,0.55);
  }
  .mark{width:56px;height:56px;margin:0 auto 20px;display:block}
  h1{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin-bottom:10px}
  p{font-size:14px;line-height:1.6;color:var(--text3);margin-bottom:24px}
  a.back{
    display:inline-block;font-size:13px;font-weight:600;text-decoration:none;
    color:var(--navy);border:1px solid var(--border-sub);border-radius:8px;
    padding:10px 20px;transition:border-color .15s,color .15s;
  }
  a.back:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="{{ asset_url('seal.svg') }}" alt="" width="56" height="56">
    <h1>Page not found</h1>
    <p>That page doesn’t exist, or your access code doesn’t cover it.</p>
    <a class="back" href="/">Back to tools</a>
  </div>
</body>
</html>
