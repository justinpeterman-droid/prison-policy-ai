<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access</title>
<link rel="icon" href="/static/seal.svg">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/tokens.css">
<style>
  :root{
    --navy:#0e1a2b;
    --text:#0f1626;--text3:#5c6675;--text4:#9096a4;
    --gold:#c9971c;--gold-bright:#ddb041;--gold-deep:#a87b10;
    --danger:#d43c30;
    --border-sub:rgba(16,24,40,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Open Sans','Inter',system-ui,sans-serif;color:var(--text);
    min-height:100vh;display:flex;align-items:center;padding:24px 24px 24px clamp(24px,8vw,120px);
    -webkit-font-smoothing:antialiased;overflow:hidden;position:relative;
  }
  /* ── Cinematic background video ── */
  .bg-video{
    position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
    z-index:0;
  }
  /* Dark navy overlay — heavier on left for card readability, fades right to reveal animation */
  .bg-overlay{
    position:fixed;inset:0;z-index:1;
    background:linear-gradient(90deg,rgba(12,22,38,0.72) 0%,rgba(14,26,43,0.55) 40%,rgba(16,31,52,0.25) 70%,rgba(16,31,52,0.15) 100%);
  }
  ::selection{background:rgba(201,151,28,0.25)}
  body::before{
    content:'';position:fixed;top:-220px;left:50%;transform:translateX(-50%);
    width:900px;height:520px;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at center,rgba(201,151,28,0.08) 0%,transparent 65%);
    filter:blur(26px);
  }
  .card{
    position:relative;z-index:3;width:100%;max-width:360px;text-align:center;
    background:rgba(255,255,255,0.88);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
    border-radius:16px;padding:36px 30px 26px;
    box-shadow:0 1px 2px rgba(0,0,0,0.3),0 30px 90px -12px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.08);
    border-top:4px solid var(--gold);
    /* ── Ghost state: barely-there until needed ── */
    opacity:0.14;transform:translateY(8px) scale(0.985);
    animation:ghost-breathe 4s ease-in-out infinite;
    transition:opacity .8s ease 1.6s,transform .8s ease 1.6s;
  }
  @keyframes ghost-breathe{0%,100%{opacity:0.12}50%{opacity:0.20}}
  /* Wake states: hover, keyboard focus inside, or autofill focus */
  .card:hover,.card:focus-within{
    opacity:1;transform:none;animation:none;
    transition:opacity .28s ease 0s,transform .28s ease 0s;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .mark{
    width:60px;height:60px;border-radius:50%;margin:0 auto 22px;display:block;
    box-shadow:0 2px 6px rgba(16,24,40,0.3);
  }
  h1{font-size:22px;font-weight:800;letter-spacing:-0.014em;margin-bottom:8px}
  .sub{font-size:14.5px;color:var(--text3);margin-bottom:28px;line-height:1.5}
  input{
    width:100%;padding:14px 14px;text-align:center;font-size:17px;letter-spacing:5px;
    background:#faf9f6;border:1px solid rgba(16,24,40,0.16);border-radius:9px;
    color:var(--text);font-family:inherit;outline:none;margin-bottom:14px;
    transition:border-color .15s,box-shadow .15s;
  }
  input::placeholder{letter-spacing:0.01em;font-size:13.5px;color:var(--text4)}
  input:focus{border-color:rgba(201,151,28,0.6);box-shadow:0 0 0 3px rgba(201,151,28,0.15)}
  button{
    width:100%;padding:14px 0;background:linear-gradient(180deg,var(--gold-bright),var(--gold) 60%,var(--gold-deep));
    color:#1a1200;border:none;border-radius:9px;font-size:16px;font-weight:800;cursor:pointer;
    font-family:inherit;transition:filter .15s,box-shadow .15s,transform .1s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 2px 10px rgba(201,151,28,0.35);
  }
  button:hover{filter:brightness(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 4px 18px rgba(201,151,28,0.5)}
  button:active{transform:translateY(1px)}
  .error-msg{
    background:rgba(212,60,48,0.07);border:1px solid rgba(212,60,48,0.3);color:var(--danger);
    padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px;font-weight:600;
  }
  .foot{margin-top:24px;font-size:11.5px;color:var(--text4);border-top:1px solid var(--border-sub);padding-top:16px}

  :where(a,button):focus-visible{outline:2px solid rgba(201,151,28,0.7);outline-offset:2px}
  @media (max-width:600px){
    body{justify-content:center;padding:24px}
    .bg-overlay{background:linear-gradient(180deg,rgba(12,22,38,0.55) 0%,rgba(14,26,43,0.65) 55%,rgba(16,31,52,0.60) 100%)}
    .card{opacity:1;transform:none;animation:none;transition:none}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
  }
</style>
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline>
  <source src="/static/dragon-bg.mp4" type="video/mp4">
</video>
<div class="bg-overlay"></div>
<div class="card">
  <img class="mark" src="/static/seal.svg" alt="" width="60" height="60">
  <h1>Standard Logistics &amp; Unit Tools</h1>
  <p class="sub">Enter your access code to continue.</p>
  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <input type="text" name="code" placeholder="Access code" autocomplete="off">
    <button type="submit">Enter</button>
  </form>
  <p class="foot">For authorized personnel only.</p>
</div>
</body>
</html>
