<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Roster</title>
<link rel="icon" href="{{ asset_url('seal.svg') }}">
<link rel="stylesheet" href="{{ asset_url('fonts.css') }}">
<link rel="stylesheet" href="{{ asset_url('tokens.css') }}">
<style>
  /* Roster-scoped visual system — mirrors the home page warm tan glass. Does not touch shared tokens.css. */
  :root{
    --bg:#f7f5f0;
    --bg-mid:#ebe4d8;
    --bg-deep:#e0d5c4;
    --panel:rgba(168,200,228,0.42);
    --panel-strong:rgba(168,200,228,0.58);
    --surface:rgba(190,218,240,0.38);
    --glass:rgba(176,210,236,0.48);
    --glass-edge:rgba(255,255,255,0.55);
    --glass-inset:rgba(255,255,255,0.28);
    --navy:#0e1a2b;--navy2:#12233c;
    --text:#0e1a2b;--text2:#1a2740;--text3:#3a465c;--text4:#5a6578;
    --gold:#c9971c;--gold-bright:#ddb041;--gold-deep:#b8860b;--gold-text:#8a6510;
    --green:#0f9d58;
    --danger:#d43c30;
    --blue-caustic:#3db4ff;--blue-deep:#0a6fbf;
    --border:rgba(14,26,43,0.14);--border-sub:rgba(14,26,43,0.09);
    --shadow-soft:0 8px 28px -12px rgba(14,26,43,0.28);
    --shadow-glass:0 4px 18px -8px rgba(14,26,43,0.22),inset 0 1px 0 rgba(255,255,255,0.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Open Sans','Inter',system-ui,sans-serif;color:var(--text);
    background:
      radial-gradient(ellipse 80% 50% at 90% 8%,rgba(224,213,196,0.45) 0%,transparent 55%),
      radial-gradient(ellipse 60% 40% at 10% 90%,rgba(235,228,216,0.4) 0%,transparent 50%),
      linear-gradient(168deg,var(--bg) 0%,var(--bg-mid) 45%,var(--bg-deep) 100%);
    min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  }
  ::selection{background:rgba(201,151,28,0.28)}

  /* —— Nav: light glass over warm tan —— */
  nav{
    position:sticky;top:0;z-index:50;
    background:var(--panel);
    backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    border-bottom:1px solid var(--glass-edge);
    box-shadow:var(--shadow-glass),0 1px 0 rgba(201,151,28,0.35);
    padding:0 24px;display:flex;align-items:center;height:58px;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
  .brand .mark{
    width:34px;height:34px;flex-shrink:0;display:block;
    object-fit:contain;object-position:center;
    filter:drop-shadow(0 1px 2px rgba(16,24,40,0.35));
  }
  .brand b{font-size:16px;font-weight:800;letter-spacing:-0.01em;color:var(--text)}
  .brand > span{font-size:12px;color:var(--text4);font-weight:400;margin-left:2px}
  .brand .brand-acronym{color:#c62828}
  .nav-right{display:flex;gap:4px;align-items:center}
  nav .nav-link{
    font-size:13.5px;font-weight:600;color:var(--text3);text-decoration:none;
    padding:7px 13px;border-radius:10px;transition:color .15s,background .15s,box-shadow .15s;
  }
  nav .nav-link:hover{
    color:var(--text);background:var(--panel-strong);
    box-shadow:inset 0 1px 0 var(--glass-inset);
  }
  nav .nav-link.active{
    color:var(--gold-text);font-weight:800;
    background:rgba(201,151,28,0.16);
    border:1px solid rgba(201,151,28,0.42);
    padding:6px 12px;
    box-shadow:inset 0 1px 0 var(--glass-inset);
  }

  /* —— Hero: tan page, navy type over faint shield watermark —— */
  .hero{
    position:relative;overflow:hidden;color:var(--text);
    padding:26px 24px 40px;
    border-bottom:1px solid rgba(14,26,43,0.08);
    background:transparent;
  }
  .hero-inner{
    position:relative;z-index:1;max-width:1080px;margin:0 auto;
    min-height:280px;display:flex;align-items:center;
  }
  .hero-copy{
    position:relative;z-index:2;min-width:0;
    width:100%;max-width:600px;
  }
  .hero-copy .kicker{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold-text);margin-bottom:10px}
  h1{font-size:clamp(30px,4.6vw,44px);font-weight:800;line-height:1.08;letter-spacing:-0.02em;margin:0 0 14px;max-width:600px;color:var(--navy)}
  .hero .sub{font-size:16px;color:var(--text3);line-height:1.6;max-width:520px}

  /* —— Faint holographic shield watermark behind hero copy —— */
  .hero-visual{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    display:flex;justify-content:center;align-items:center;
    padding:0 0 0 min(12%,80px);
    perspective:1100px;
    background:transparent;border:none;box-shadow:none;
    opacity:0.46;
    mix-blend-mode:soft-light;
  }
  .hero-visual .shield-float{
    width:min(420px,46vw);height:auto;
    margin-left:auto;margin-right:2%;
  }
  .shield-float{
    position:relative;width:100%;aspect-ratio:1;
    pointer-events:auto;
    background:transparent;border:none;border-radius:0;padding:0;
    box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
    animation:shield-sway 20s ease-in-out infinite;
    transform-style:preserve-3d;
    transform:rotateY(-28deg) rotateX(4deg);
    transition:transform .35s cubic-bezier(.22,.61,.25,1);
    filter:drop-shadow(0 4px 10px rgba(14,26,43,0.06));
  }
  .shield-float:hover{
    transform:rotateY(-32deg) rotateX(5deg) scale(1.015);
    animation-play-state:paused;
  }
  .shield-float:hover .shield-wrap{animation-play-state:paused}
  @keyframes shield-sway{
    0%,100%{transform:rotateY(-28deg) rotateX(4deg)}
    50%{transform:rotateY(0deg) rotateX(1.5deg)}
  }
  .shield-wrap{
    position:relative;z-index:1;width:100%;height:100%;
    overflow:hidden;
    background:transparent;border:none;border-radius:0;padding:0;
    box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
    animation:shield-bob 7s ease-in-out infinite;
  }
  @keyframes shield-bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-16px)}
  }
  .shield-img{
    width:100%;height:100%;object-fit:contain;display:block;
    position:relative;z-index:1;
    opacity:0.78;
    background:transparent;border:none;border-radius:0;
  }
  .shield-alt{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    width:100%;height:100%;object-fit:contain;
    opacity:0.28;
    filter:blur(6px) saturate(1.4) brightness(1.08) hue-rotate(-4deg);
    mix-blend-mode:screen;
    transform-origin:50% 48%;
    will-change:transform,opacity;
    animation:shield-swirl-drift 12s ease-in-out infinite;
  }
  .shield-lettering{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    width:100%;height:100%;object-fit:contain;display:block;
    opacity:0.92;
    filter:
      drop-shadow(0 1px 1px rgba(8,16,32,0.35))
      drop-shadow(0 1px 3px rgba(10,22,40,0.18));
  }
  @keyframes shield-swirl-drift{
    0%{
      opacity:0.14;
      transform:scale(1) translate(0,0) rotate(0deg);
    }
    25%{
      opacity:0.4;
      transform:scale(1.06) translate(2.2%,-1.8%) rotate(1.5deg);
    }
    50%{
      opacity:0.24;
      transform:scale(1.03) translate(-1.6%,1.4%) rotate(-1deg);
    }
    75%{
      opacity:0.44;
      transform:scale(1.08) translate(1.8%,1.2%) rotate(2deg);
    }
    100%{
      opacity:0.14;
      transform:scale(1) translate(0,0) rotate(0deg);
    }
  }
  .shield-caustic{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    -webkit-mask-image:url({{ asset_url('shield-crystal.webp') }});
    mask-image:url({{ asset_url('shield-crystal.webp') }});
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-mode:alpha;mask-mode:alpha;
    mix-blend-mode:screen;opacity:0.22;
    background:
      radial-gradient(ellipse 42% 32% at 32% 30%,rgba(120,210,255,0.28) 0%,transparent 58%),
      radial-gradient(ellipse 38% 44% at 72% 62%,rgba(30,130,255,0.2) 0%,transparent 55%);
    background-size:180% 180%,200% 200%;
    will-change:background-position,opacity;
    animation:caustic-drift 10s linear infinite;
  }
  .shield-caustic::before,
  .shield-caustic::after,
  .shield-swirl{display:none!important}
  @keyframes caustic-drift{
    0%{background-position:0% 20%,100% 40%;opacity:0.16}
    50%{background-position:40% 60%,30% 70%;opacity:0.26}
    100%{background-position:0% 20%,100% 40%;opacity:0.16}
  }
  .shield-swirl-tex{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    -webkit-mask-image:url({{ asset_url('shield-crystal.webp') }});
    mask-image:url({{ asset_url('shield-crystal.webp') }});
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-mode:alpha;mask-mode:alpha;
    mix-blend-mode:screen;
    opacity:0.55;
    overflow:hidden;
  }
  .shield-swirl-tex .swirl-a,
  .shield-swirl-tex .swirl-b{
    position:absolute;inset:-26%;
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
    transform-origin:50% 48%;
    will-change:transform,opacity;
    mix-blend-mode:plus-lighter;
  }
  .shield-swirl-tex .swirl-a{
    background-image:url({{ asset_url('shield-swirl-tex.webp') }});
    opacity:0.7;
    animation:swirl-tex-spin 16s linear infinite;
  }
  .shield-swirl-tex .swirl-b{
    background-image:url({{ asset_url('shield-swirl-tex-b.webp') }});
    opacity:0.4;
    animation:swirl-tex-spin-rev 22s linear infinite, swirl-tex-crossfade 9s ease-in-out infinite;
  }
  @keyframes swirl-tex-spin{
    0%{transform:translate(0,0) rotate(0deg) scale(1.08)}
    25%{transform:translate(2.5%,-1.5%) rotate(90deg) scale(1.12)}
    50%{transform:translate(-1.5%,2%) rotate(180deg) scale(1.06)}
    75%{transform:translate(1.8%,1.2%) rotate(270deg) scale(1.14)}
    100%{transform:translate(0,0) rotate(360deg) scale(1.08)}
  }
  @keyframes swirl-tex-spin-rev{
    0%{transform:translate(0,0) rotate(0deg) scale(1.1)}
    50%{transform:translate(-2%,1.5%) rotate(-180deg) scale(1.16)}
    100%{transform:translate(0,0) rotate(-360deg) scale(1.1)}
  }
  @keyframes swirl-tex-crossfade{
    0%,100%{opacity:0.22}
    50%{opacity:0.5}
  }
  .shield-spirals{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    width:100%;height:100%;display:block;
    -webkit-mask-image:url({{ asset_url('shield-crystal.webp') }});
    mask-image:url({{ asset_url('shield-crystal.webp') }});
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-mode:alpha;mask-mode:alpha;
    mix-blend-mode:screen;opacity:0.28;
    overflow:hidden;
  }
  .shield-spirals .spiral-spin,
  .shield-spirals .spiral-spin-rev{
    transform-box:view-box;
    transform-origin:50% 47.7%;
    will-change:transform;
  }
  .shield-spirals .spiral-spin{
    animation:spiral-rotate 14s linear infinite;
  }
  .shield-spirals .spiral-spin-rev{
    animation:spiral-rotate 19s linear infinite reverse;
  }
  .shield-spirals path{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  @keyframes spiral-rotate{
    to{transform:rotate(360deg)}
  }
  @media(max-width:860px){
    .hero-inner{min-height:240px}
    .hero-visual{
      padding:0;opacity:0.38;
      mix-blend-mode:soft-light;
    }
    .hero-visual .shield-float{
      width:min(340px,70vw);margin:0 auto;
    }
    .shield-float{transform:rotateY(-22deg) rotateX(3deg)}
    .shield-float:hover{transform:rotateY(-26deg) rotateX(4deg) scale(1.01)}
    @keyframes shield-sway{
      0%,100%{transform:rotateY(-22deg) rotateX(3deg)}
      50%{transform:rotateY(-2deg) rotateX(1deg)}
    }
    @keyframes shield-bob{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }
  }
  @media(max-width:520px){
    .hero-inner{min-height:210px}
    .hero-visual{opacity:0.32}
    .hero-visual .shield-float{width:min(260px,82vw)}
  }

  /* ── Claw divider — curved PNG (cream lips + crimson) ── */
  .claw{
    display:flex;justify-content:center;align-items:center;
    padding:30px 0 4px;max-width:960px;margin:0 auto;
    background:transparent;border:none;box-shadow:none;
  }
  .claw-img{
    height:80px;width:auto;max-width:min(200px,40vw);
    display:block;background:transparent;border:none;
    transform:rotate(-9deg);
    transform-origin:center 42%;
    clip-path:inset(0 0 100% 0);opacity:0;
    filter:drop-shadow(0 0 1.5px rgba(200,12,24,.45));
    animation:claw-slash .55s ease-out forwards,
              claw-pulse 2.4s .65s ease-in-out infinite;
  }
  @keyframes claw-slash{
    0%{clip-path:inset(0 0 100% 0);opacity:0}
    18%{opacity:.92}
    100%{clip-path:inset(0 0 0 0);opacity:.98}
  }
  @keyframes claw-pulse{
    0%,100%{
      opacity:.86;
      filter:drop-shadow(0 0 1px rgba(180,10,20,.35));
    }
    50%{
      opacity:1;
      filter:drop-shadow(0 0 2.5px rgba(230,28,40,.7));
    }
  }

  /* ── page shell ── */
  .page{max-width:1100px;margin:0 auto;padding:24px 24px 64px;width:100%;flex:1}

  /* ── shift grid ── */
  /* 3×2: top A B U · bottom C D F (order set in JS) */
  .shift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media(max-width:600px){.shift-grid{grid-template-columns:1fr}}

  /* ── shift card ── */
  .shift-card{
    background:var(--glass);border:1px solid var(--glass-edge);border-radius:16px;
    backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:var(--shadow-glass),var(--shadow-soft);
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .16s cubic-bezier(.22,.61,.25,1),box-shadow .16s ease;
  }
  .shift-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-glass),0 18px 40px -16px rgba(14,26,43,0.3),0 0 0 1px rgba(201,151,28,0.35);
  }
  .shift-head{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--glass-edge);
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .shift-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:10px;
    font-size:20px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;
    background:linear-gradient(180deg,var(--navy2),var(--navy));color:var(--gold-bright);
    border:1px solid rgba(201,151,28,0.42);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 2px 12px rgba(14,26,43,0.28);
    flex-shrink:0;
  }
  .shift-info{margin-left:12px;flex:1}
  .shift-label{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-0.012em}
  .shift-hours{font-size:12px;color:var(--text4);margin-top:2px;font-variant-numeric:tabular-nums}
  .shift-count{font-size:11px;font-weight:700;color:var(--gold-text);margin-top:3px;letter-spacing:0.02em}

  /* ── staff rows ── */
  .staff-list{padding:6px 0;flex:1}
  .staff-row{
    display:flex;align-items:center;gap:10px;padding:9px 20px;
    border-bottom:1px solid rgba(255,255,255,0.32);
    transition:background .12s;
  }
  .staff-row:last-child{border-bottom:none}
  .staff-row:hover{background:rgba(255,255,255,0.26)}
  .staff-rank{font-size:11px;font-weight:800;color:var(--gold-text);text-transform:uppercase;letter-spacing:0.04em;width:36px;flex-shrink:0}
  .staff-name{font-size:13.5px;font-weight:600;color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .staff-emp{font-size:11.5px;color:var(--text4);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:550;flex-shrink:0}
  .staff-actions{display:flex;gap:4px;flex-shrink:0}
  .btn-icon{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--glass-edge);
    background:rgba(255,255,255,0.22);cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:var(--text4);transition:all .12s;font-size:12px;
  }
  .btn-icon:hover{color:var(--text);border-color:rgba(201,151,28,0.5);background:rgba(255,255,255,0.5)}
  .btn-icon.danger:hover{color:var(--danger);border-color:rgba(212,60,48,0.42);background:rgba(212,60,48,0.1)}

  .empty-shift{
    padding:28px 20px;text-align:center;color:var(--text4);
    font-size:13px;line-height:1.55;
  }

  /* ── add button ── */
  .add-row{border-top:1px solid var(--glass-edge);padding:10px 12px}
  .btn-add{
    width:100%;padding:9px 0;background:rgba(255,255,255,0.2);color:var(--gold-text);
    border:1px dashed rgba(201,151,28,0.48);border-radius:10px;
    font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
    transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-add:hover{background:rgba(201,151,28,0.14);border-color:rgba(201,151,28,0.75);color:var(--gold-deep)}
  .btn-add .plus{font-size:16px;font-weight:400;line-height:1}

  /* ── inline form (add / edit) ── */
  .staff-form{
    padding:14px 20px;border-bottom:1px solid var(--glass-edge);
    background:rgba(255,255,255,0.26);
    display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;
  }
  .staff-form .field{display:flex;flex-direction:column;gap:3px}
  .staff-form label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--text4)}
  .staff-form input, .staff-form select{
    padding:6px 9px;font-size:13px;font-family:inherit;color:var(--text2);
    background:rgba(255,255,255,0.72);border:1px solid var(--border);border-radius:8px;
    outline:none;transition:border-color .12s,box-shadow .12s;
  }
  .staff-form input:focus, .staff-form select:focus{
    border-color:rgba(201,151,28,0.6);box-shadow:0 0 0 3px rgba(201,151,28,0.15);
  }
  .staff-form input{width:120px}
  .staff-form select{width:70px}
  .staff-form .field-num input{width:90px}
  .staff-form .form-actions{display:flex;gap:5px;align-items:center;margin-bottom:3px}
  .btn-sm{
    padding:7px 15px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
    border:none;transition:filter .15s,box-shadow .15s,transform .12s,background .15s,border-color .15s;
  }
  .btn-sm:active{transform:translateY(1px)}
  .btn-sm.save{
    background:linear-gradient(180deg,#ddb041 0%,#c9971c 45%,#b8860b 100%);
    color:var(--navy);
    border:1px solid #9a7010;
    box-shadow:
      inset 0 1px 0 rgba(255,236,180,0.55),
      0 2px 0 rgba(138,101,16,0.35),
      0 6px 18px rgba(168,123,16,0.42),
      0 2px 6px rgba(14,26,43,0.12);
  }
  .btn-sm.save:hover{
    filter:brightness(1.06);
    box-shadow:
      inset 0 1px 0 rgba(255,236,180,0.65),
      0 2px 0 rgba(138,101,16,0.4),
      0 10px 26px rgba(168,123,16,0.5),
      0 4px 10px rgba(14,26,43,0.14);
  }
  .btn-sm.cancel{
    background:var(--glass);color:var(--text3);border:1px solid var(--glass-edge);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:inset 0 1px 0 var(--glass-inset);
  }
  .btn-sm.cancel:hover{color:var(--text);background:var(--panel-strong)}

  /* ── toast ── */
  .toast{
    position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,var(--navy2),var(--navy));color:#f4efe4;
    padding:11px 22px;border-radius:12px;
    font-size:13px;font-weight:700;
    border:1px solid rgba(201,151,28,0.42);
    box-shadow:0 8px 30px -10px rgba(14,26,43,0.55),inset 0 1px 0 rgba(255,255,255,0.1);
    z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1}
  .toast.err{background:linear-gradient(180deg,#d9483c,#b32b21);border-color:rgba(255,255,255,0.28);color:#fff}

  /* ── confirmation overlay ── */
  .overlay{
    position:fixed;inset:0;background:rgba(14,26,43,0.45);z-index:80;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .overlay.show{opacity:1;pointer-events:auto}

<div class="page">
  <div class="shift-grid" id="shiftGrid"></div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>

<script>
// ── state ──
let roster = null; // { shifts: {...}, staff: [...] }
let editingShift = null; // shift letter of open form

// ── API ──
async function api(url, opts={}) {
  const res = await fetch(url, { headers: {'Content-Type':'application/json'}, ...opts });
  if (!res.ok) throw new Error((await res.json()).error || 'Request failed');
  return res.json();
}

// ── toast ──
function toast(msg, err){ const e=document.getElementById('toast'); e.textContent=msg; e.className='toast'+(err?' err':'')+' show'; setTimeout(()=>e.classList.remove('show'),2200); }

// ── confirm ──
function confirm(msg){ return new Promise(r => { const o=document.getElementById('overlay'), d=document.getElementById('dialog'); d.innerHTML=`<p>${msg}</p><div class="btns"><button class="btn-sm cancel" id="cfmNo">Cancel</button><button class="btn-sm save" id="cfmYes">Remove</button></div>`; o.classList.add('show'); d.querySelector('#cfmNo').onclick=()=>{o.classList.remove('show');r(false)}; d.querySelector('#cfmYes').onclick=()=>{o.classList.remove('show');r(true)}; }); }

// ── render ──
async function load(){ roster = await api('/api/roster'); render(); }

function staffForShift(shift){ return roster.staff.filter(s => s.shift === shift); }

function render(){
  const grid = document.getElementById('shiftGrid');
  const shiftKeys = ['A','B','U','C','D','F'];
  grid.innerHTML = shiftKeys.map(shift => {
    const def = roster.shifts[shift] || {label:'Unknown',hours:'—'};
    const staff = staffForShift(shift);
    const editing = editingShift === shift;

    let rows = '';
    if (editing) {
      rows += `<div class="staff-form" id="form-${shift}">
        <div class="field"><label>Rank</label><select id="f_rank"><option>Sgt.</option><option>Cpl.</option><option>Cpt.</option><option>Lt.</option><option>Ofc.</option></select></div>
        <div class="field"><label>First</label><input id="f_first" placeholder="First"></div>
        <div class="field"><label>Last</label><input id="f_last" placeholder="Last"></div>
        <div class="field field-num"><label>Number</label><input id="f_emp" placeholder="B5123"></div>
        <div class="form-actions">
          <button class="btn-sm save" onclick="addStaff('${shift}')">Add</button>
          <button class="btn-sm cancel" onclick="editingShift=null;render()">Cancel</button>
        </div>
      </div>`;
    }
    if (!staff.length && !editing) {
      rows += `<div class="empty-shift">No staff assigned to ${shift} shift.</div>`;
    } else {
      staff.forEach(s => {
        rows += `<div class="staff-row">
          <span class="staff-rank">${esc(s.rank||'')}</span>
          <span class="staff-name">${esc(s.last||'')}, ${esc(s.first||'')}</span>
          <span class="staff-emp">${esc(s.employee_number||'')}</span>
          <span class="staff-actions">
            <button class="btn-icon" title="Edit" onclick="editStaff('${esc(s.employee_number)}')">✎</button>
            <button class="btn-icon danger" title="Remove" onclick="removeStaff('${esc(s.employee_number)}')">✕</button>
          </span>
        </div>`;
      });
    }

    return `<div class="shift-card">
      <div class="shift-head">
        <div class="shift-badge">${shift}</div>
        <div class="shift-info">
          <div class="shift-label">${esc(def.label)}</div>
          ${def.hours ? `<div class="shift-hours">${esc(def.hours)}</div>` : ''}
          <div class="shift-count">${staff.length} staff</div>
        </div>
      </div>
      <div class="staff-list">${rows}</div>
      ${editing ? '' : `<div class="add-row"><button class="btn-add" onclick="editingShift='${shift}';render()"><span class="plus">+</span> Add Staff to ${shift}</button></div>`}
    </div>`;
  }).join('');
}

// ── actions ──
async function addStaff(shift){
  const r = document.getElementById('f_rank').value;
  const f = document.getElementById('f_first').value.trim();
  const l = document.getElementById('f_last').value.trim();
  const e = document.getElementById('f_emp').value.trim();
  if (!l || !e) return toast('Last name and employee number are required.', true);
  try {
    await api('/api/roster/staff', {method:'POST',body:JSON.stringify({rank:r,first:f,last:l,employee_number:e,shift})});
    editingShift = null;
    await load();
    toast(`${l}, ${f} added to ${shift} shift.`);
  } catch(err){ toast(err.message, true); }
}

async function editStaff(emp){
  const s = roster.staff.find(x => x.employee_number === emp);
  if (!s) return;
  // prompt for new shift (simple approach — could be an inline form instead)
  const newShift = prompt(`Move ${s.rank} ${s.first} ${s.last} to which shift? (A/B/C/D/U/F)`, s.shift);
  if (!newShift || newShift === s.shift) return;
  if (!['A','B','C','D','U','F'].includes(newShift.toUpperCase())) return toast('Invalid shift.', true);
  try {
    await api(`/api/roster/staff/${encodeURIComponent(emp)}`, {method:'PUT',body:JSON.stringify({shift:newShift.toUpperCase()})});
    await load();
    toast(`${s.last} moved to ${newShift.toUpperCase()} shift.`);
  } catch(err){ toast(err.message, true); }
}

async function removeStaff(emp){
  const s = roster.staff.find(x => x.employee_number === emp);
  if (!s) return;
  if (!await confirm(`Remove <b>${esc(s.rank)} ${esc(s.first)} ${esc(s.last)}</b> (${esc(emp)}) from the roster?`)) return;
  try {
    await api(`/api/roster/staff/${encodeURIComponent(emp)}`, {method:'DELETE'});
    await load();
    toast(`${s.last} removed.`);
  } catch(err){ toast(err.message, true); }
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

load();
</script>
