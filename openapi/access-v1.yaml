          oneOf:
            - { $ref: "#/components/schemas/Uuid" }
            - { type: "null" }
        reason: { type: string, minLength: 1, maxLength: 500 }
      example:
        new_owner_staff_id: 00000000-0000-4000-8000-000000000023
        reason: Fictional reassignment for shift coverage.
    AdminReportFilterSet:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        The RP-05 closed structured filter set, reused verbatim by bulk
        export. Structured columns only; never narrative or field-notes text.
      properties:
        report_id: { $ref: "#/components/schemas/Uuid" }
        incident_id: { $ref: "#/components/schemas/Uuid" }
