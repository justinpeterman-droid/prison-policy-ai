openapi: 3.1.0
info:
  title: Prison Policy Access API
  version: 1.0.0
  description: Versioned API for the managed Microsoft Access client.
tags:
  - name: Authentication
  - name: Self
  - name: Admin Staff
  - name: Admin Accounts
  - name: Browser Handoff
security:
  - AccessBearer: []
paths:
  /api/v1/client-policy:
    get:
      operationId: getClientPolicy
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Current Access compatibility policy
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/auth/login:
    post:
      operationId: loginAccessClient
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: New opaque Access session and server-owned profile
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/auth/renew:
    post:
      operationId: renewAccessSession
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewRequest"
      responses:
        "200":
          description: Rotated opaque Access session and server-owned profile
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/SessionReauthenticationRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    XClientVersion:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/RequestId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    XRequestId:
      description: Validated request correlation identifier.
      schema:
        $ref: "#/components/schemas/RequestId"
  responses:
    ValidationFailed:
      description: Closed request validation failed
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidCredentials:
      description: Employee number or PIN is invalid
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SessionReauthenticationRequired:
      description: Renewal is invalid and a new sign-in is required
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Authentication rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DependencyUnavailable:
      description: Authentication persistence dependency is unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      example: request_20260812_000001
    UtcTimestamp:
      type: string
      format: date-time
      example: '2026-08-12T18:30:00Z'
    Uuid:
      type: string
      format: uuid
      example: 00000000-0000-4000-8000-000000000001
    Cursor:
      type: string
      minLength: 40
      maxLength: 512
    FictionalEmployeeNumber:
      type: string
      example: TEST-1001
    OpaqueToken:
      type: string
      example: example-token-not-valid
    LoginRequest:
      type: object
      additionalProperties: false
      required: [employee_number, pin, device_id, device_label, persistent]
      properties:
        employee_number:
          $ref: "#/components/schemas/FictionalEmployeeNumber"
        pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Z9Y8X7
        device_id:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
          example: device-fictional-user-0001
        device_label:
          type: string
          minLength: 1
          maxLength: 120
          example: Fictional Intake Desk
        persistent:
          type: boolean
          example: false
    RenewRequest:
      type: object
      additionalProperties: false
      required: [renewal_token, device_id]
      properties:
        renewal_token:
          type: string
          minLength: 40
          maxLength: 512
          writeOnly: true
          example: example-renewal-token-not-valid
        device_id:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
          example: device-fictional-user-0001
    SessionProfile:
      type: object
      additionalProperties: false
      required: [staff_id, employee_number, display_name, rank, shift, role, status]
      properties:
        staff_id:
          $ref: "#/components/schemas/Uuid"
        employee_number:
          $ref: "#/components/schemas/FictionalEmployeeNumber"
        display_name:
          type: string
          example: Officer Avery Morgan
        rank:
          type: string
          example: Officer
        shift:
          type: string
          example: A
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, locked, deactivated]
    SessionTokenData:
      type: object
      additionalProperties: false
      required:
        - session_id
        - access_token
        - renewal_token
        - access_expires_at
        - renewal_expires_at
        - persistent
        - requires_pin_change
        - profile
      properties:
        session_id:
          $ref: "#/components/schemas/Uuid"
        access_token:
          $ref: "#/components/schemas/OpaqueToken"
        renewal_token:
          $ref: "#/components/schemas/OpaqueToken"
        access_expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
        renewal_expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
        persistent:
          type: boolean
        requires_pin_change:
          type: boolean
        profile:
          $ref: "#/components/schemas/SessionProfile"
    AuthSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          $ref: "#/components/schemas/SessionTokenData"
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    ClientPolicy:
      type: object
      additionalProperties: false
      required:
        - release_version
        - latest_client_version
        - minimum_client_version
        - minimum_server_version
        - api_version
        - release_notes
        - read_only_required
        - review_lab_origin
        - field_notes_max_characters
      properties:
        release_version:
          type: string
          example: 1.4.0
        latest_client_version:
          type: string
          example: 1.4.0
        minimum_client_version:
          type: string
          example: 1.2.0
        minimum_server_version:
          type: string
          example: 1.2.0
        api_version:
          type: string
          enum: [v1]
        release_notes:
          type: string
          minLength: 1
          maxLength: 500
          example: Fictional reviewed release.
        read_only_required:
          type: boolean
          example: false
        review_lab_origin:
          type: string
          format: uri
          example: https://review.example.gov
        field_notes_max_characters:
          type: integer
          const: 30000
          example: 30000
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          $ref: "#/components/schemas/ClientPolicy"
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id, server_time, api_version]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
