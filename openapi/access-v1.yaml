    ClientPolicy:
      type: object
      additionalProperties: false
      required:
        - release_version
        - latest_client_version
        - minimum_client_version
        - minimum_server_version
        - api_version
        - release_notes
        - read_only_required
        - review_lab_origin
        - field_notes_max_characters
      properties:
        release_version:
          type: string
          example: 1.4.0
        latest_client_version:
          type: string
          example: 1.4.0
        minimum_client_version:
          type: string
          example: 1.2.0
        minimum_server_version:
          type: string
          example: 1.2.0
        api_version:
          type: string
          enum: [v1]
        release_notes:
          type: string
          minLength: 1
          maxLength: 500
          example: Fictional reviewed release.
        read_only_required:
          type: boolean
          example: false
        review_lab_origin:
          type: string
          format: uri
          example: https://review.example.gov
        field_notes_max_characters:
          type: integer
          const: 30000
          example: 30000
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          $ref: "#/components/schemas/ClientPolicy"
        request_id:
          $ref: "#/components/schemas/RequestId"
