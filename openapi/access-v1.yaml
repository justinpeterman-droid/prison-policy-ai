        - name: report_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: incident_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: reporting_staff_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: preparer_staff_id
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Uuid" }
        - name: incident_date_from
          in: query
          required: false
          schema: { type: string, format: date, minLength: 1 }
        - name: incident_date_to
          in: query
          required: false
          schema: { type: string, format: date, minLength: 1 }
        - name: created_at_from
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UtcTimestamp" }
        - name: created_at_to
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UtcTimestamp" }
        - name: inmate_first_name
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: inmate_middle_name
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: inmate_last_name
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: inmate_adc_number
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: category
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: facility
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: location
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: shift
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: status
          in: query
          required: false
