          items: { $ref: "#/components/schemas/AdminReportSearchItem" }
        next_cursor: { $ref: "#/components/schemas/PageCursorValue" }
    AdminReportSearchSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/AdminReportSearchData" } } }]
    AdminReportRevisionSummary:
