        preparer_staff_id: { $ref: "#/components/schemas/Uuid" }
        incident_date_from: { type: string, format: date, minLength: 1 }
        incident_date_to: { type: string, format: date, minLength: 1 }
        created_at_from: { $ref: "#/components/schemas/UtcTimestamp" }
        created_at_to: { $ref: "#/components/schemas/UtcTimestamp" }
        inmate_first_name: { type: string, minLength: 1, maxLength: 200 }
        inmate_middle_name: { type: string, minLength: 1, maxLength: 200 }
        inmate_last_name: { type: string, minLength: 1, maxLength: 200 }
        inmate_adc_number: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 200 }
        facility: { type: string, minLength: 1, maxLength: 200 }
        location: { type: string, minLength: 1, maxLength: 200 }
        shift: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [in_progress, completed, archived] }
        last_editor_staff_id: { $ref: "#/components/schemas/Uuid" }
        modified_at_from: { $ref: "#/components/schemas/UtcTimestamp" }
        modified_at_to: { $ref: "#/components/schemas/UtcTimestamp" }
      example: { status: completed }
    AdminBulkExportSelectionByIds:
      type: object
      additionalProperties: false
      required: [mode, report_ids]
      properties:
        mode: { type: string, const: report_ids }
        report_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/Uuid" }
      example:
        mode: report_ids
        report_ids: [00000000-0000-4000-8000-000000000041]
    AdminBulkExportSelectionByFilters:
      type: object
      additionalProperties: false
      required: [mode, filters]
      properties:
        mode: { type: string, const: filters }
