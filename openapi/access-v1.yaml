      responses:
        "200":
          description: Handoff redeemed into an HttpOnly browser session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserHandoffRedeemSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/HandoffInvalid" }
