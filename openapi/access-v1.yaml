          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string, const: request_in_progress }
            message: { type: string }
            retryable: { type: boolean, const: true }
        request_id: { $ref: "#/components/schemas/RequestId" }
        server_time: { $ref: "#/components/schemas/UtcTimestamp" }
        api_version: { type: string, const: v1 }
    ClientUpgradeRequiredEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id, server_time, api_version]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string, const: client_upgrade_required }
            message: { type: string }
            retryable: { type: boolean, const: false }
        request_id: { $ref: "#/components/schemas/RequestId" }
        server_time: { $ref: "#/components/schemas/UtcTimestamp" }
        api_version: { type: string, const: v1 }
