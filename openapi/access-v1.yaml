              schema: { $ref: "#/components/schemas/ReportRecoverySuccessEnvelope" }
              examples:
                recovery: { value: { data: { report_id: 00000000-0000-4000-8000-000000000041, recovery_revision_number: 5, current_revision_number: 4, status: in_progress, content: { schema_version: 1, narrative: "Fictional preserved local narrative.", editable_fields: {}, validation: {}, warnings: [] }, editor_staff_member_id: 00000000-0000-4000-8000-000000000021, editor_display_name: "Officer Alex Example", created_at: "2026-08-12T15:09:00Z" }, request_id: req_20260812_report_recovery, server_time: "2026-08-12T15:09:01Z", api_version: v1 } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RevisionOrIdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/reports/{report_id}/export-docx:
    post:
      operationId: exportEmployeeReportDocx
      tags: [Reports]
      description: >-
        Generate the official 005 Word document for one explicit, immutable
        revision. `revision` is required and positive: the server never infers
        "latest", never accepts a revision in a request body, and never
        silently coerces a malformed value. Bytes are deterministic, so the
        same revision replayed under the same `Idempotency-Key` reproduces the
        same document, the same `Digest`, and the same `X-Export-ID` without
        creating a second export record. Only metadata is persisted
        (identifiers, SHA-256, byte length, MIME type, download name, template
        version); the document itself is streamed and its temporary file is
        removed when the response closes.
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { $ref: "#/components/parameters/ExportRevision" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Deterministic Word document for the named immutable revision
          headers:
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
            Digest: { $ref: "#/components/headers/Digest" }
            X-Export-ID: { $ref: "#/components/headers/XExportId" }
            X-Report-Revision: { $ref: "#/components/headers/XReportRevision" }
            X-Template-Version: { $ref: "#/components/headers/XTemplateVersion" }
            X-Request-ID: { $ref: "#/components/headers/XRequestId" }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
