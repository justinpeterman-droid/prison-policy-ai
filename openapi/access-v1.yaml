openapi: 3.1.0
info:
  title: Prison Policy Access API
  version: 1.0.0
  description: Versioned API for the managed Microsoft Access client.
tags:
  - name: Authentication
  - name: Self
  - name: Admin Staff
  - name: Admin Accounts
  - name: Browser Handoff
security:
  - AccessBearer: []
paths:
  /api/v1/client-policy:
    get:
      operationId: getClientPolicy
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Current Access compatibility policy
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/auth/login:
    post:
      operationId: loginAccessClient
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: New opaque Access session and server-owned profile
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/auth/renew:
    post:
      operationId: renewAccessSession
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewRequest"
      responses:
        "200":
          description: Rotated opaque Access session and server-owned profile
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/SessionReauthenticationRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/me:
    get:
      operationId: getCurrentActorProfile
      tags: [Self]
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Server-owned current account and staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/auth/logout:
    post:
      operationId: logoutCurrentSession
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Current session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAllSessions
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: All account sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutAllSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/auth/change-pin:
    post:
      operationId: changeCurrentPin
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XDeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePinRequest"
      responses:
        "200":
          description: PIN changed and current opaque session rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/auth/sessions:
    get:
      operationId: listCurrentAccountSessions
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Safe current-account session summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PinChangeRequired"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/auth/sessions/{session_id}:
    delete:
      operationId: revokeCurrentAccountSession
      tags: [Authentication]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Selected session family revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevokeSuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/PinChangeRequired"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/v1/auth/admin-step-up:
    post:
      operationId: confirmAdminPin
      tags: [Authentication]
      parameters:
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminStepUpRequest" }
      responses:
        "200": { description: Elevation refreshed, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStepUpSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/staff:
    get:
      operationId: listAdminStaff
      tags: [Admin Staff]
      parameters:
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/PageLimit" }
        - { $ref: "#/components/parameters/PageCursor" }
        - { $ref: "#/components/parameters/StaffQuery" }
      responses:
        "200": { description: Bounded staff page, content: { application/json: { schema: { $ref: "#/components/schemas/StaffPageSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AdminElevationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      operationId: createAdminStaff
      tags: [Admin Staff]
      parameters:
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCreateRequest" }
      responses:
        "200": { description: Staff created, content: { application/json: { schema: { $ref: "#/components/schemas/StaffSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/staff/{staff_id}:
    patch:
      operationId: updateAdminStaff
      tags: [Admin Staff]
      parameters:
        - { $ref: "#/components/parameters/StaffId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffUpdateRequest" }
      responses:
        "200": { description: Staff updated, content: { application/json: { schema: { $ref: "#/components/schemas/StaffSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [Admin Accounts]
      parameters:
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/PageLimit" }
        - { $ref: "#/components/parameters/PageCursor" }
      responses:
        "200": { description: Bounded account page, content: { application/json: { schema: { $ref: "#/components/schemas/AccountPageSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AdminElevationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      operationId: createAdminAccount
      tags: [Admin Accounts]
      parameters:
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreateRequest" }
      responses:
        "200": { description: Account and one-time PIN, content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryPinSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/accounts/{account_id}:
    patch:
      operationId: updateAdminAccount
      tags: [Admin Accounts]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdateRequest" }
      responses:
        "200": { description: Account updated, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/accounts/{account_id}/reset-pin:
    post:
      operationId: resetAdminAccountPin
      tags: [Admin Accounts]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      responses:
        "200": { description: Reset one-time PIN, content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryPinSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/accounts/{account_id}/unlock:
    post:
      operationId: unlockAdminAccount
      tags: [Admin Accounts]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      responses:
        "200": { description: Account unlocked, content: { application/json: { schema: { $ref: "#/components/schemas/AccountSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/accounts/{account_id}/sessions:
    get:
      operationId: listAdminAccountSessions
      tags: [Admin Accounts]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/PageLimit" }
        - { $ref: "#/components/parameters/PageCursor" }
      responses:
        "200": { description: Safe account sessions, content: { application/json: { schema: { $ref: "#/components/schemas/AdminSessionPageSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AdminElevationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/accounts/{account_id}/revoke-sessions:
    post:
      operationId: revokeAdminAccountSessions
      tags: [Admin Accounts]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeSessionsRequest" }
      responses:
        "200": { description: Sessions revoked, content: { application/json: { schema: { $ref: "#/components/schemas/RevokeSessionsSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/review-lab-handoffs:
    post:
      operationId: issueReviewLabHandoff
      tags: [Browser Handoff]
      parameters:
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      responses:
        "201":
          description: One-time Review Lab handoff issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserHandoffIssueSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/browser-handoffs/redeem:
    post:
      operationId: redeemReviewLabHandoff
      tags: [Browser Handoff]
      security: []
      parameters:
        - { $ref: "#/components/parameters/XRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserHandoffRedeemRequest" }
      responses:
        "200":
          description: Handoff redeemed into an HttpOnly browser session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserHandoffRedeemSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/HandoffInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    XClientVersion:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/RequestId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    XDeviceId:
      name: X-Device-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    XAdminStepUp:
      name: X-Admin-Step-Up
      in: header
      required: true
      schema:
        type: string
        minLength: 40
        maxLength: 512
        writeOnly: true
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Cursor" }
    StaffQuery:
      name: query
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
    StaffId:
      name: staff_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
  headers:
    XRequestId:
      description: Validated request correlation identifier.
      schema:
        $ref: "#/components/schemas/RequestId"
  responses:
    ValidationFailed:
      description: Closed request validation failed
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidCredentials:
      description: Employee number or PIN is invalid
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SessionReauthenticationRequired:
      description: Renewal is invalid and a new sign-in is required
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Authentication rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          description: Seconds until every exceeded login dimension is safe to retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DependencyUnavailable:
      description: Authentication persistence dependency is unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    AuthenticationRequired:
      description: A valid live bearer session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: Mutation conflict; code is idempotency_conflict, request_in_progress, idempotent_response_unavailable, client_upgrade_required, duplicate_employee_number, account_already_exists, last_active_admin, or account_conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PinChangeRequired:
      description: The temporary PIN must be changed before this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdminElevationRequired:
      description: Admin authorization failed; code is permission_denied, pin_change_required, or admin_elevation_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    StepUpRequired:
      description: Admin authorization failed; code is permission_denied, pin_change_required, admin_elevation_required, or step_up_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    HandoffInvalid:
      description: The one-time handoff is invalid, expired, or already redeemed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      example: request_20260812_000001
    UtcTimestamp:
      type: string
      format: date-time
      example: '2026-08-12T18:30:00Z'
    Uuid:
      type: string
      format: uuid
      example: 00000000-0000-4000-8000-000000000001
    Cursor:
      type: string
      minLength: 40
      maxLength: 512
    FictionalEmployeeNumber:
      type: string
      example: TEST-1001
    OpaqueToken:
      type: string
      example: example-token-not-valid
    LoginRequest:
      type: object
      additionalProperties: false
      required: [employee_number, pin, device_id, device_label, persistent]
      properties:
        employee_number:
          $ref: "#/components/schemas/FictionalEmployeeNumber"
        pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Z9Y8X7
        device_id:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
          example: device-fictional-user-0001
        device_label:
          type: string
          minLength: 1
          maxLength: 120
          example: Fictional Intake Desk
        persistent:
          type: boolean
          example: false
    RenewRequest:
      type: object
      additionalProperties: false
      required: [renewal_token, device_id]
      properties:
        renewal_token:
          type: string
          minLength: 40
          maxLength: 512
          writeOnly: true
          example: example-renewal-token-not-valid
        device_id:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
          example: device-fictional-user-0001
    ChangePinRequest:
      type: object
      additionalProperties: false
      required: [current_pin, new_pin]
      properties:
        current_pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Z9Y8X7
        new_pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Q7W9E2
    SessionProfile:
      type: object
      additionalProperties: false
      required: [staff_id, employee_number, display_name, rank, shift, role, status]
      properties:
        staff_id:
          $ref: "#/components/schemas/Uuid"
        employee_number:
          $ref: "#/components/schemas/FictionalEmployeeNumber"
        display_name:
          type: string
          example: Officer Avery Morgan
        rank:
          type: string
          example: Officer
        shift:
          type: string
          example: A
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, locked, deactivated]
    SessionTokenData:
      type: object
      additionalProperties: false
      required:
        - session_id
        - access_token
        - renewal_token
        - access_expires_at
        - renewal_expires_at
        - persistent
        - requires_pin_change
        - profile
      properties:
        session_id:
          $ref: "#/components/schemas/Uuid"
        access_token:
          $ref: "#/components/schemas/OpaqueToken"
        renewal_token:
          $ref: "#/components/schemas/OpaqueToken"
        access_expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
        renewal_expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
        persistent:
          type: boolean
        requires_pin_change:
          type: boolean
        profile:
          $ref: "#/components/schemas/SessionProfile"
    AuthSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          $ref: "#/components/schemas/SessionTokenData"
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    GenericSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    MeData:
      type: object
      additionalProperties: false
      required: [account_id, staff_id, session_id, employee_number, display_name, rank, shift, role, status, must_change_pin]
      properties:
        account_id: { $ref: "#/components/schemas/Uuid" }
        staff_id: { $ref: "#/components/schemas/Uuid" }
        session_id: { $ref: "#/components/schemas/Uuid" }
        employee_number: { $ref: "#/components/schemas/FictionalEmployeeNumber" }
        display_name: { type: string }
        rank: { type: string }
        shift: { type: string }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, locked, deactivated] }
        must_change_pin: { type: boolean }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, device_label, persistent, created_at, last_used_at, renewal_expires_at, current]
      properties:
        session_id: { $ref: "#/components/schemas/Uuid" }
        device_label: { type: string, maxLength: 120 }
        persistent: { type: boolean }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        last_used_at: { $ref: "#/components/schemas/UtcTimestamp" }
        renewal_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
        current: { type: boolean }
    LogoutData:
      type: object
      additionalProperties: false
      required: [signed_out]
      properties:
        signed_out: { type: boolean, const: true }
    LogoutAllData:
      type: object
      additionalProperties: false
      required: [signed_out_account_id, session_count]
      properties:
        signed_out_account_id: { $ref: "#/components/schemas/Uuid" }
        session_count: { type: integer, minimum: 0 }
    SessionRevokeData:
      type: object
      additionalProperties: false
      required: [session_id, revoked]
      properties:
        session_id: { $ref: "#/components/schemas/Uuid" }
        revoked: { type: boolean, const: true }
    MeSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MeData" }
    LogoutSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LogoutData" }
    LogoutAllSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LogoutAllData" }
    SessionListSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/SessionSummary" }
    SessionRevokeSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SessionRevokeData" }
    AdminPurpose:
      type: string
      enum: [admin_center, staff_write, account_create, account_role_status, account_reset_pin, account_unlock, account_revoke_sessions, report_restore, report_transfer, bulk_export, audit_export, review_lab_handoff]
    SensitiveAdminPurpose:
      type: string
      enum: [staff_write, account_create, account_role_status, account_reset_pin, account_unlock, account_revoke_sessions, report_restore, report_transfer, bulk_export, audit_export, review_lab_handoff]
    AdminStepUpRequest:
      type: object
      additionalProperties: false
      required: [pin, purpose]
      properties:
        pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
        purpose: { $ref: "#/components/schemas/AdminPurpose" }
    AdminElevationData:
      type: object
      additionalProperties: false
      required: [purpose, elevation_expires_at]
      properties:
        purpose: { const: admin_center }
        elevation_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
    AdminPurposeTokenData:
      type: object
      additionalProperties: false
      required: [purpose, elevation_expires_at, step_up_token, step_up_expires_at]
      properties:
        purpose: { $ref: "#/components/schemas/SensitiveAdminPurpose" }
        elevation_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
        step_up_token: { type: string, minLength: 40, maxLength: 512, writeOnly: true }
        step_up_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
    AdminStepUpSuccessEnvelope:
      allOf:
        - { $ref: "#/components/schemas/GenericSuccessEnvelope" }
        - type: object
          properties:
            data:
              oneOf:
                - { $ref: "#/components/schemas/AdminElevationData" }
                - { $ref: "#/components/schemas/AdminPurposeTokenData" }
    StaffCreateRequest:
      type: object
      additionalProperties: false
      required: [employee_number, rank, first_name, last_name, shift]
      properties:
        employee_number: { type: string, minLength: 1, maxLength: 64 }
        rank: { type: string, maxLength: 64 }
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        shift: { type: string, minLength: 1, maxLength: 16 }
    StaffUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        employee_number: { type: string, minLength: 1, maxLength: 64 }
        rank: { type: string, maxLength: 64 }
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        shift: { type: string, minLength: 1, maxLength: 16 }
        is_active: { type: boolean }
    StaffData:
      type: object
      additionalProperties: false
      required: [staff_id, employee_number, rank, first_name, last_name, shift, is_active, created_at, updated_at]
      properties:
        staff_id: { $ref: "#/components/schemas/Uuid" }
        employee_number: { type: string, maxLength: 64 }
        rank: { type: string, maxLength: 64 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        shift: { type: string, maxLength: 16 }
        is_active: { type: boolean }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        updated_at: { $ref: "#/components/schemas/UtcTimestamp" }
    AccountCreateRequest:
      type: object
      additionalProperties: false
      required: [staff_id, role]
      properties:
        staff_id: { $ref: "#/components/schemas/Uuid" }
        role: { type: string, enum: [user, admin] }
    AccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [role, status]
      properties:
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, deactivated] }
    AccountData:
      type: object
      additionalProperties: false
      required: [account_id, staff_id, role, status, must_change_pin, created_at, updated_at]
      properties:
        account_id: { $ref: "#/components/schemas/Uuid" }
        staff_id: { $ref: "#/components/schemas/Uuid" }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, locked, deactivated] }
        must_change_pin: { type: boolean }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        updated_at: { $ref: "#/components/schemas/UtcTimestamp" }
    PageCursorValue:
      oneOf:
        - { $ref: "#/components/schemas/Cursor" }
        - { type: 'null' }
    StaffPageData:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/StaffData" } }
        next_cursor: { $ref: "#/components/schemas/PageCursorValue" }
    AccountPageData:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AccountData" } }
        next_cursor: { $ref: "#/components/schemas/PageCursorValue" }
    TemporaryPinFirstData:
      type: object
      additionalProperties: false
      required: [operation_reference_id, account_id, temporary_pin, one_time_value_unavailable]
      properties:
        operation_reference_id: { $ref: "#/components/schemas/Uuid" }
        account_id: { $ref: "#/components/schemas/Uuid" }
        temporary_pin: { type: string, minLength: 4, maxLength: 8, writeOnly: true }
        one_time_value_unavailable: { type: boolean, const: false }
    TemporaryPinReplayData:
      type: object
      additionalProperties: false
      required: [operation_reference_id, account_id, one_time_value_unavailable]
      properties:
        operation_reference_id: { $ref: "#/components/schemas/Uuid" }
        account_id: { $ref: "#/components/schemas/Uuid" }
        one_time_value_unavailable: { type: boolean, const: true }
    TemporaryPinSuccessEnvelope:
      allOf:
        - { $ref: "#/components/schemas/GenericSuccessEnvelope" }
        - type: object
          properties:
            data:
              oneOf:
                - { $ref: "#/components/schemas/TemporaryPinFirstData" }
                - { $ref: "#/components/schemas/TemporaryPinReplayData" }
    AdminSessionData:
      type: object
      additionalProperties: false
      required: [session_id, device_label, persistent, created_at, last_used_at, idle_expires_at, revoked_at, current]
      properties:
        session_id: { $ref: "#/components/schemas/Uuid" }
        device_label: { type: string, maxLength: 120 }
        persistent: { type: boolean }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        last_used_at: { $ref: "#/components/schemas/UtcTimestamp" }
        idle_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
        revoked_at:
          oneOf:
            - { $ref: "#/components/schemas/UtcTimestamp" }
            - { type: 'null' }
        current: { type: boolean }
    AdminSessionPageData:
      type: object
      additionalProperties: false
      required: [account_id, items, next_cursor]
      properties:
        account_id: { $ref: "#/components/schemas/Uuid" }
        items: { type: array, items: { $ref: "#/components/schemas/AdminSessionData" } }
        next_cursor: { $ref: "#/components/schemas/PageCursorValue" }
    RevokeSessionsRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [scope]
          properties: { scope: { const: all } }
        - type: object
          additionalProperties: false
          required: [scope, session_id]
          properties:
            scope: { const: one }
            session_id: { $ref: "#/components/schemas/Uuid" }
    RevokeSessionsData:
      type: object
      additionalProperties: false
      required: [account_id, scope, revoked_session_ids, revoked_count]
      properties:
        account_id: { $ref: "#/components/schemas/Uuid" }
        scope: { type: string, enum: [all, one] }
        revoked_session_ids: { type: array, items: { $ref: "#/components/schemas/Uuid" } }
        revoked_count: { type: integer, minimum: 0 }
    BrowserHandoffIssueData:
      type: object
      additionalProperties: false
      required: [handoff_url, expires_at]
      properties:
        handoff_url:
          type: string
          format: uri
          pattern: '^https://[^?#]+/access-handoff#[A-Za-z0-9_-]{40,512}$'
          example: https://managed.example/access-handoff#example-token-not-valid
        expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
    BrowserHandoffRedeemRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 40
          maxLength: 512
          writeOnly: true
          example: example-token-not-valid
    BrowserHandoffRedeemData:
      type: object
      additionalProperties: false
      required: [redeemed]
      properties:
        redeemed: { type: boolean, const: true }
    BrowserHandoffIssueSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/BrowserHandoffIssueData" } } }]
    BrowserHandoffRedeemSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/BrowserHandoffRedeemData" } } }]
    StaffSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/StaffData" } } }]
    StaffPageSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/StaffPageData" } } }]
    AccountSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/AccountData" } } }]
    AccountPageSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/AccountPageData" } } }]
    AdminSessionPageSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/AdminSessionPageData" } } }]
    RevokeSessionsSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/RevokeSessionsData" } } }]
    ClientPolicy:
      type: object
      additionalProperties: false
      required:
        - release_version
        - latest_client_version
        - minimum_client_version
        - minimum_server_version
        - api_version
        - release_notes
        - read_only_required
        - review_lab_origin
        - field_notes_max_characters
      properties:
        release_version:
          type: string
          example: 1.4.0
        latest_client_version:
          type: string
          example: 1.4.0
        minimum_client_version:
          type: string
          example: 1.2.0
        minimum_server_version:
          type: string
          example: 1.2.0
        api_version:
          type: string
          enum: [v1]
        release_notes:
          type: string
          minLength: 1
          maxLength: 500
          example: Fictional reviewed release.
        read_only_required:
          type: boolean
          example: false
        review_lab_origin:
          type: string
          format: uri
          example: https://review.example.gov
        field_notes_max_characters:
          type: integer
          const: 30000
          example: 30000
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          $ref: "#/components/schemas/ClientPolicy"
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id, server_time, api_version]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
