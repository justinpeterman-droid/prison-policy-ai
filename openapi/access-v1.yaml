        source_revision_number: { type: [integer, "null"], minimum: 0 }
        editor_account_id: { $ref: "#/components/schemas/Uuid" }
        editor_staff_member_id: { $ref: "#/components/schemas/Uuid" }
        editor_display_name: { type: [string, "null"], maxLength: 200 }
        editor_rank: { type: [string, "null"], maxLength: 64 }
        content_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        client_version: { type: string, maxLength: 64 }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        is_current: { type: boolean }
    AdminReportRevisionData:
      type: object
