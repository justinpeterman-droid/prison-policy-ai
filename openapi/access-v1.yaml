        - { name: occurred_at_from, in: query, schema: { type: string, format: date-time } }
        - { name: occurred_at_to, in: query, schema: { type: string, format: date-time } }
        - { name: actor_account_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: actor_staff_member_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: action_family, in: query, schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' } }
        - { name: target_type, in: query, schema: { type: string, maxLength: 64 } }
        - { name: target_id, in: query, schema: { $ref: "#/components/schemas/Uuid" } }
        - { name: result, in: query, schema: { type: string, enum: [success, denied, failed] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string, minLength: 16, maxLength: 512 } }
      responses:
        "200": { description: Safe immutable audit page, content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventListSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
