          properties:
            code: { type: string, const: client_upgrade_required }
            message: { type: string }
            retryable: { type: boolean, const: false }
        request_id: { $ref: "#/components/schemas/RequestId" }
        server_time: { $ref: "#/components/schemas/UtcTimestamp" }
        api_version: { type: string, const: v1 }
    PolicyQuestionTurn:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        answer: { type: string, maxLength: 2000 }
    PolicyQuestionRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        history:
          type: array
          items: { $ref: "#/components/schemas/PolicyQuestionTurn" }
      description: >-
        Closed question envelope. The server keeps at most the six most recent
        valid turns and drops older or malformed turns rather than rejecting an
        otherwise valid question. The client never supplies a
        model, prompt, temperature or any identity field; the actor is taken
        from the bearer session alone.
    PolicyCitation:
      type: object
      additionalProperties: false
      required: [n, source, text]
      properties:
        n: { type: integer, minimum: 1 }
        source: { type: string, maxLength: 300 }
        text: { type: string, maxLength: 8000 }
    PolicyAnswerData:
      type: object
      additionalProperties: false
      required: [answer, citations, sources]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/PolicyCitation" }
        sources:
          type: array
          items: { type: string, maxLength: 300 }
        retrieved_sources:
          type: array
          items: { type: string, maxLength: 300 }
      description: >-
        The answer is delivered once and never persisted, so it carries no
        stored-response handle, cache flag or actor identity.
    PolicyAnswerSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/PolicyAnswerData" } } }]
    ReportSuccessEnvelope:
      allOf: [{ $ref: "#/components/schemas/GenericSuccessEnvelope" }, { type: object, properties: { data: { $ref: "#/components/schemas/ReportData" } } }]
    ReportListSuccessEnvelope:
