      tags: [Admin Reports]
      description: Opening another employee's report writes a `report.viewed_by_admin` audit event.
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
      responses:
        "200": { description: Authorized Admin report detail, content: { application/json: { schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" } } } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AdminElevationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    patch:
      operationId: editAdminReport
      tags: [Admin Reports]
      description: >-
        Calls the shared `save_report()` service with `reason="admin_edit"`.
        No step-up is required, but the edit is attributed to the
        administrator and claims/completes its Idempotency-Key in the same
        transaction as the revision and audit write.
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReportEditRequest" }
      responses:
        "200": { description: Admin-attributed report revision appended, content: { application/json: { schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AdminElevationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Safe report mutation conflict; no report content is returned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReportRevisionConflictEnvelope"
                  - $ref: "#/components/schemas/ReportIdempotencyConflictEnvelope"
                  - $ref: "#/components/schemas/ReportRequestInProgressEnvelope"
                  - $ref: "#/components/schemas/ClientUpgradeRequiredEnvelope"
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
