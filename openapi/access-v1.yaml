  /api/v1/admin/reports/{report_id}/restore:
    post:
      operationId: restoreAdminReportRevision
      tags: [Admin Reports]
      description: >-
        Exactly `{"revision_number": 7}`. Requires the purpose-scoped,
        single-use `X-Admin-Step-Up` token for `report_restore`. Calls the
        shared `restore_report()` service to create a new `restored`
        revision referencing the immutable source; no revision is ever
        overwritten, deleted, or renumbered.
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRestoreRequest" }
            example: { revision_number: 7 }
      responses:
        "200": { description: Historical snapshot copied into a new current revision, content: { application/json: { schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Safe report mutation conflict; no report content is returned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReportRevisionConflictEnvelope"
                  - $ref: "#/components/schemas/ReportIdempotencyConflictEnvelope"
                  - $ref: "#/components/schemas/ReportRequestInProgressEnvelope"
                  - $ref: "#/components/schemas/ClientUpgradeRequiredEnvelope"
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/reports/{report_id}/transfer:
    post:
      operationId: transferAdminReportOwnership
      tags: [Admin Reports]
      description: >-
        Requires the purpose-scoped, single-use `X-Admin-Step-Up` token for
        `report_transfer`. Verifies both targets are active staff, locks the
        affected rows, replaces owner/preparer access transactionally, and
        appends an `ownership_change` revision plus a
        `report.ownership_transferred` audit event.
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReportTransferRequest" }
      responses:
        "200": { description: Ownership transferred and one ownership revision appended, content: { application/json: { schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Safe report mutation conflict; no report content is returned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReportRevisionConflictEnvelope"
                  - $ref: "#/components/schemas/ReportIdempotencyConflictEnvelope"
                  - $ref: "#/components/schemas/ReportRequestInProgressEnvelope"
                  - $ref: "#/components/schemas/ClientUpgradeRequiredEnvelope"
