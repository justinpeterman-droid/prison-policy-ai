  /api/v1/policy/questions:
    post:
      operationId: askPolicyQuestion
      tags: [Policy Expert]
      summary: Ask the cited Policy Expert one bounded question
      description: >-
        Answers one policy question synchronously, with citations, inside a
        90-second server budget. The question, the answer and every citation
        passage are deliberately never stored: only an idempotency request
        digest, a document count and a latency figure survive the request.
        The complete gate, retrieval and model sequence shares the 90-second
        deadline; a timed-out request does not continue provider work. Because no
        response is retained, a duplicate Idempotency-Key is refused rather
        than replayed, and it never buys a second provider call.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - name: X-Request-ID
          in: header
          required: true
          description: Caller-generated correlation identifier for this billable request.
          schema: { $ref: "#/components/schemas/RequestId" }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyQuestionRequest" }
            examples:
              followUp:
                value:
                  question: "What does the fictional policy require after a use of force?"
                  history:
                    - question: "What is the fictional restraint rule?"
                      answer: "The fictional rule requires supervisor notification."
      responses:
        "200":
          description: Cited answer, assembled from retrieved policy passages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyAnswerSuccessEnvelope" }
              examples:
                cited:
                  value:
                    data:
                      answer: "The fictional policy requires a supervisor notification [1]."
                      citations:
                        - n: 1
                          source: "Fictional Policy AD-00-00"
                          text: "Fictional passage describing the notification duty."
                      sources: ["Fictional Policy AD-00-00"]
                      retrieved_sources: ["Fictional Policy AD-00-00"]
                    request_id: req_20260812_policy_question
                    server_time: "2026-08-12T15:09:00Z"
                    api_version: v1
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PinChangeRequired" }
        "409": { $ref: "#/components/responses/PolicyQuestionConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
        "504": { $ref: "#/components/responses/DependencyTimeout" }
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    XClientVersion:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/RequestId"
    RequiredXRequestId:
      name: X-Request-ID
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/RequestId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    XDeviceId:
      name: X-Device-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    XAdminStepUp:
      name: X-Admin-Step-Up
      in: header
      required: true
      schema:
        type: string
        minLength: 40
        maxLength: 512
        writeOnly: true
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Cursor" }
    StaffQuery:
      name: query
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
    StaffId:
      name: staff_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ReportId:
      name: report_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    RevisionNumber:
      name: revision_number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Quoted integer revision matching base_revision_number when supplied.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"1"'
    StaffLookupQuery:
      name: query
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 100, example: Example }
    StaffLookupLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ExportRevision:
      name: revision
      in: query
      required: true
      description: >-
        The exact immutable revision to export. Positive integer; never
        inferred, never defaulted to the current revision, never read from a
        request body.
      schema: { type: integer, minimum: 1, example: 2 }
  headers:
    XRequestId:
      description: Validated request correlation identifier.
      schema:
        $ref: "#/components/schemas/RequestId"
    ContentDisposition:
      description: Attachment disposition whose filename is built from identifiers only.
      schema:
        type: string
        example: attachment; filename="report-00000000-0000-4000-8000-000000000041-revision-2.docx"
    Digest:
      description: RFC 3230 digest of the exported bytes, base64 SHA-256.
      schema:
        type: string
        pattern: '^sha-256=[A-Za-z0-9+/]{43}=$'
    XExportId:
      description: Identifier of the persisted export metadata record.
      schema:
        $ref: "#/components/schemas/Uuid"
    XReportRevision:
      description: The exact immutable revision number the document was built from.
      schema:
        type: integer
        minimum: 1
        example: 2
    XTemplateVersion:
      description: Stable identity of the 005 template that produced the document.
      schema:
        type: string
        maxLength: 64
        example: 005_template_v3:0123456789abcdef
  responses:
    ValidationFailed:
      description: Closed request validation failed
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidCredentials:
      description: Employee number or PIN is invalid
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SessionReauthenticationRequired:
      description: Renewal is invalid and a new sign-in is required
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Authentication rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          description: Seconds until every exceeded login dimension is safe to retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DependencyUnavailable:
      description: Authentication persistence dependency is unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    AuthenticationRequired:
      description: A valid live bearer session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PolicyQuestionConflict:
      description: >-
        Code is request_in_progress while the first answer is being produced,
        idempotent_response_unavailable once it settles, idempotency_conflict
        for a changed payload under the same key, or client_upgrade_required
        for an unsupported write-capable client. Policy answers are never stored,
        so a completed duplicate cannot replay an answer or buy a second call.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DependencyTimeout:
      description: The Policy Expert exceeded the 90-second server budget; code is dependency_timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error; code is internal_error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: Mutation conflict; code is idempotency_conflict, request_in_progress, idempotent_response_unavailable, client_upgrade_required, duplicate_employee_number, account_already_exists, last_active_admin, or account_conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PinChangeRequired:
      description: The temporary PIN must be changed before this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdminElevationRequired:
      description: Admin authorization failed; code is permission_denied, pin_change_required, or admin_elevation_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    StepUpRequired:
      description: Admin authorization failed; code is permission_denied, pin_change_required, admin_elevation_required, or step_up_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RevisionOrIdempotencyConflict:
      description: Revision or idempotency conflict; code is revision_conflict, idempotency_conflict, request_in_progress, or client_upgrade_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ReportRevisionConflict:
      description: Safe report conflict metadata only; no report content is returned
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReportRevisionConflictEnvelope" }
          examples:
            stale_save:
              value:
                error:
                  code: revision_conflict
                  message: The fictional report changed; reload before saving.
                  retryable: false
                  details:
                    current_revision_number: 7
                    current_editor_display_name: Officer Alex Example
                    current_edited_at: "2026-08-12T15:10:00Z"
                    changed_fields: [narrative]
                request_id: req_20260812_report_conflict
                server_time: "2026-08-12T15:10:01Z"
                api_version: v1
    BlockingInformationRequired:
      description: Required incident information is unresolved; code is blocking_information_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    JobAccepted:
      description: Durable queued job and transactional outbox intent created
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JobSuccessEnvelope" }
    JobSubmissionConflict:
      description: Revision or shared-idempotency submission conflict
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/JobRevisionConflictEnvelope"
              - $ref: "#/components/schemas/JobIdempotencyConflictEnvelope"
              - $ref: "#/components/schemas/JobRequestInProgressEnvelope"
              - $ref: "#/components/schemas/JobClientUpgradeRequiredEnvelope"
          examples:
            stale_revision:
              value:
                error:
                  code: revision_conflict
                  message: The fictional incident changed; reload before submitting the job.
                  retryable: false
                  details: { current_revision_number: 2 }
                request_id: request_job_conflict_0001
                server_time: "2026-08-12T15:10:01Z"
                api_version: v1
            changed_payload:
              value:
                error:
                  code: idempotency_conflict
                  message: The fictional key was used for another request.
                  retryable: false
                request_id: request_job_conflict_0002
                server_time: "2026-08-12T15:10:02Z"
                api_version: v1
            still_running:
              value:
                error:
                  code: request_in_progress
                  message: The fictional job submission is still in progress.
                  retryable: true
                request_id: request_job_conflict_0003
                server_time: "2026-08-12T15:10:03Z"
                api_version: v1
            client_upgrade:
              value:
                error:
                  code: client_upgrade_required
                  message: Update Access before submitting another fictional job.
                  retryable: false
                request_id: request_job_conflict_0004
                server_time: "2026-08-12T15:10:04Z"
                api_version: v1
    BulkExportConflict:
      description: >-
        Bulk export conflict; code is bulk_export_limit_exceeded when the
        resolved selection exceeds 100 documents (no archive is generated), or
        idempotency_conflict / request_in_progress for a reused key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            bulk_export_limit_exceeded:
              value: { error: { code: bulk_export_limit_exceeded, message: A bulk export is limited to 100 documents., retryable: false }, request_id: req_20260812_bulk_export_limit, server_time: "2026-08-12T15:11:01Z", api_version: v1 }
            idempotency_conflict:
              value: { error: { code: idempotency_conflict, message: The idempotency key was used for another fictional request., retryable: false }, request_id: req_20260812_bulk_export_conflict, server_time: "2026-08-12T15:11:01Z", api_version: v1 }
    AuditExportConflict:
      description: >-
        Audit export conflict. `audit_export_limit_exceeded` means the filtered
        immutable result set exceeded 10,000 rows; no CSV was generated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            audit_export_limit_exceeded:
              value: { error: { code: audit_export_limit_exceeded, message: Narrow the fictional audit filters before exporting., retryable: false }, request_id: request_audit_limit_0001, server_time: '2026-08-12T18:30:00Z', api_version: v1 }
            idempotency_conflict:
              value: { error: { code: idempotency_conflict, message: The fictional export request conflicts with an existing request., retryable: false }, request_id: request_audit_conflict_0001, server_time: '2026-08-12T18:30:00Z', api_version: v1 }
    HandoffInvalid:
      description: The one-time handoff is invalid, expired, or already redeemed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      example: request_20260812_000001
    UtcTimestamp:
      type: string
      format: date-time
      minLength: 1
      example: '2026-08-12T18:30:00Z'
    Uuid:
      type: string
      format: uuid
      minLength: 1
      example: 00000000-0000-4000-8000-000000000001
    BuildMetadata:
      type: object
      additionalProperties: false
      required: [source_commit, cloud_run_revision, alembic_revision]
      properties:
        source_commit: { type: string, maxLength: 64, example: development }
        cloud_run_revision: { type: string, maxLength: 128, example: development }
        alembic_revision: { type: string, maxLength: 64, example: '20260812_0005' }
    AdminOverviewData:
      type: object
      additionalProperties: false
      required: [reports, queued_jobs, pending_outbox, recent_audit_events, build]
      properties:
        reports: { type: integer, minimum: 0, maximum: 1000000000 }
        queued_jobs: { type: integer, minimum: 0, maximum: 1000000000 }
        pending_outbox: { type: integer, minimum: 0, maximum: 1000000000 }
        recent_audit_events: { type: integer, minimum: 0, maximum: 1000000000 }
        build: { $ref: "#/components/schemas/BuildMetadata" }
    AdminOverviewSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data: { $ref: "#/components/schemas/AdminOverviewData" }
        request_id: { $ref: "#/components/schemas/RequestId" }
        server_time: { $ref: "#/components/schemas/UtcTimestamp" }
        api_version: { type: string, const: v1 }
    HealthComponent:
      type: object
      additionalProperties: false
      required: [component, status]
      properties:
        component: { type: string, enum: [database, queue, backup_restore] }
        status: { type: string, enum: [Operational, Degraded, Unavailable] }
    AdminHealthData:
      type: object
      additionalProperties: false
      required: [status, components, build]
      properties:
        status: { type: string, enum: [Operational, Degraded, Unavailable] }
        components:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/HealthComponent" }
        build: { $ref: "#/components/schemas/BuildMetadata" }
    AdminHealthSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data: { $ref: "#/components/schemas/AdminHealthData" }
        request_id: { $ref: "#/components/schemas/RequestId" }
        server_time: { $ref: "#/components/schemas/UtcTimestamp" }
        api_version: { type: string, const: v1 }
    AuditEventDetails:
      type: object
      additionalProperties: false
      properties:
        persistent: { type: boolean }
        reason: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        lock_minutes: { type: integer, minimum: 0, maximum: 1000000000 }
        session_count: { type: integer, minimum: 0, maximum: 1000000000 }
        purpose: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        target_staff_id: { $ref: "#/components/schemas/Uuid" }
        target_account_id: { $ref: "#/components/schemas/Uuid" }
        role: { type: string, enum: [user, admin] }
        old_role: { type: string, enum: [user, admin] }
        new_role: { type: string, enum: [user, admin] }
        handoff_id: { $ref: "#/components/schemas/Uuid" }
        browser_session_id: { $ref: "#/components/schemas/Uuid" }
        operation_id: { $ref: "#/components/schemas/Uuid" }
        approval_reference_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        incident_id: { $ref: "#/components/schemas/Uuid" }
        report_id: { $ref: "#/components/schemas/Uuid" }
        export_id: { $ref: "#/components/schemas/Uuid" }
        job_id: { $ref: "#/components/schemas/Uuid" }
        revision_number: { type: integer, minimum: 0, maximum: 1000000000 }
        source_revision_number: { type: integer, minimum: 0, maximum: 1000000000 }
        result_count: { type: integer, minimum: 0, maximum: 1000000000 }
        report_count: { type: integer, minimum: 0, maximum: 1000000000 }
        event_count: { type: integer, minimum: 0, maximum: 1000000000 }
        latency_ms: { type: integer, minimum: 0, maximum: 1000000000 }
        document_count: { type: integer, minimum: 0, maximum: 1000000000 }
        changed_fields: { type: array, maxItems: 100, items: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' } }
        filters: { type: array, maxItems: 100, items: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' } }
        report_type: { type: string, enum: [first_person, supervisor_summary, cover_letter, disciplinary, investigation, form_005] }
        export_format: { type: string, const: docx }
        job_type: { type: string, enum: [classify, extract, generate, disciplinary] }
        result_code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        question_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        old_status: { type: string, enum: [in_progress, completed, archived] }
        new_status: { type: string, enum: [in_progress, completed, archived] }
        old_owner_staff_id: { $ref: "#/components/schemas/Uuid" }
        new_owner_staff_id: { $ref: "#/components/schemas/Uuid" }
    AuditEventData:
      type: object
      additionalProperties: false
      required: [event_id, occurred_at, actor_account_id, actor_staff_member_id, action, target_type, target_id, result, details]
      properties:
        event_id: { $ref: "#/components/schemas/Uuid" }
        occurred_at: { $ref: "#/components/schemas/UtcTimestamp" }
        actor_account_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: 'null' }] }
        actor_staff_member_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: 'null' }] }
        action: { type: string, maxLength: 120 }
        target_type: { type: string, maxLength: 64 }
        target_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: 'null' }] }
        result: { type: string, enum: [success, denied, failed] }
        details: { $ref: "#/components/schemas/AuditEventDetails" }
    AuditEventListData:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AuditEventData" } }
        next_cursor: { oneOf: [{ type: string, minLength: 16, maxLength: 512 }, { type: 'null' }] }
    AuditEventListSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data: { $ref: "#/components/schemas/AuditEventListData" }
        request_id: { $ref: "#/components/schemas/RequestId" }
        server_time: { $ref: "#/components/schemas/UtcTimestamp" }
        api_version: { type: string, const: v1 }
    AuditExportRequest:
      type: object
      additionalProperties: false
      required: [filters, format, reason]
      properties:
        filters:
          type: object
          additionalProperties: false
          properties:
            occurred_at_from: { type: string, format: date-time }
            occurred_at_to: { type: string, format: date-time }
            actor_account_id: { $ref: "#/components/schemas/Uuid" }
            actor_staff_member_id: { $ref: "#/components/schemas/Uuid" }
            action_family: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
            target_type: { type: string, maxLength: 64 }
            target_id: { $ref: "#/components/schemas/Uuid" }
            result: { type: string, enum: [success, denied, failed] }
        format: { type: string, const: csv }
        reason: { type: string, minLength: 1, maxLength: 500 }
    SubmitJobRequest:
      type: object
      additionalProperties: false
      required: [base_revision_number]
      properties:
        base_revision_number:
          type: integer
          minimum: 1
          example: 1
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobStage:
      type: string
      enum:
        - queued
        - classifying
        - extracting
        - validating
        - generating
        - disciplinary
        - completed
        - failed
    JobResultReportReference:
      type: object
      additionalProperties: false
      required: [report_id, revision_number]
      properties:
        report_id: { $ref: "#/components/schemas/Uuid" }
        revision_number: { type: integer, minimum: 1 }
    JobResultReference:
      type: object
      additionalProperties: false
      properties:
        incident_revision_number: { type: integer, minimum: 1 }
        reports:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/JobResultReportReference" }
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - incident_id
        - job_type
        - state
        - stage
        - created_at
        - started_at
        - completed_at
        - error_code
        - result_reference
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        incident_id: { $ref: "#/components/schemas/Uuid" }
        job_type:
          type: string
          enum: [classify, extract, generate, disciplinary]
        state: { $ref: "#/components/schemas/JobState" }
        stage: { $ref: "#/components/schemas/JobStage" }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        started_at:
          oneOf:
            - $ref: "#/components/schemas/UtcTimestamp"
            - type: "null"
        completed_at:
          oneOf:
            - $ref: "#/components/schemas/UtcTimestamp"
            - type: "null"
        error_code:
          type: [string, "null"]
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        result_reference: { $ref: "#/components/schemas/JobResultReference" }
    JobSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data: { $ref: "#/components/schemas/Job" }
        request_id: { $ref: "#/components/schemas/RequestId" }
        server_time: { $ref: "#/components/schemas/UtcTimestamp" }
        api_version: { type: string, const: v1 }
    JobRevisionConflictEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            error:
              type: object
              properties: { code: { const: revision_conflict } }
    JobIdempotencyConflictEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            error:
              type: object
              properties: { code: { const: idempotency_conflict } }
    JobRequestInProgressEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            error:
              type: object
              properties: { code: { const: request_in_progress } }
    JobClientUpgradeRequiredEnvelope:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            error:
              type: object
              properties: { code: { const: client_upgrade_required } }
    Cursor:
      type: string
      minLength: 40
      maxLength: 512
    FictionalEmployeeNumber:
      type: string
      example: TEST-1001
    OpaqueToken:
      type: string
      example: example-token-not-valid
    LoginRequest:
      type: object
      additionalProperties: false
      required: [employee_number, pin, device_id, device_label, persistent]
      properties:
        employee_number:
          $ref: "#/components/schemas/FictionalEmployeeNumber"
        pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Z9Y8X7
        device_id:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
          example: device-fictional-user-0001
        device_label:
          type: string
          minLength: 1
          maxLength: 120
          example: Fictional Intake Desk
        persistent:
          type: boolean
          example: false
    RenewRequest:
      type: object
      additionalProperties: false
      required: [renewal_token, device_id]
      properties:
        renewal_token:
          type: string
          minLength: 40
          maxLength: 512
          writeOnly: true
          example: example-renewal-token-not-valid
        device_id:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
          example: device-fictional-user-0001
    ChangePinRequest:
      type: object
      additionalProperties: false
      required: [current_pin, new_pin]
      properties:
        current_pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Z9Y8X7
        new_pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Q7W9E2
    SessionProfile:
      type: object
      additionalProperties: false
      required: [staff_id, employee_number, display_name, rank, shift, role, status]
      properties:
        staff_id:
          $ref: "#/components/schemas/Uuid"
        employee_number:
          $ref: "#/components/schemas/FictionalEmployeeNumber"
        display_name:
          type: string
          example: Officer Avery Morgan
        rank:
          type: string
          example: Officer
        shift:
          type: string
          example: A
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, locked, deactivated]
    SessionTokenData:
      type: object
      additionalProperties: false
      required:
        - session_id
        - access_token
        - renewal_token
        - access_expires_at
        - renewal_expires_at
        - persistent
        - requires_pin_change
        - profile
      properties:
        session_id:
          $ref: "#/components/schemas/Uuid"
        access_token:
          $ref: "#/components/schemas/OpaqueToken"
        renewal_token:
          $ref: "#/components/schemas/OpaqueToken"
        access_expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
        renewal_expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
        persistent:
          type: boolean
        requires_pin_change:
          type: boolean
        profile:
          $ref: "#/components/schemas/SessionProfile"
    AuthSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          $ref: "#/components/schemas/SessionTokenData"
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    GenericSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    MeData:
      type: object
      additionalProperties: false
      required: [account_id, staff_id, session_id, employee_number, display_name, rank, shift, role, status, must_change_pin]
      properties:
        account_id: { $ref: "#/components/schemas/Uuid" }
        staff_id: { $ref: "#/components/schemas/Uuid" }
        session_id: { $ref: "#/components/schemas/Uuid" }
        employee_number: { $ref: "#/components/schemas/FictionalEmployeeNumber" }
        display_name: { type: string }
        rank: { type: string }
        shift: { type: string }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, locked, deactivated] }
        must_change_pin: { type: boolean }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, device_label, persistent, created_at, last_used_at, renewal_expires_at, current]
      properties:
        session_id: { $ref: "#/components/schemas/Uuid" }
        device_label: { type: string, maxLength: 120 }
        persistent: { type: boolean }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        last_used_at: { $ref: "#/components/schemas/UtcTimestamp" }
