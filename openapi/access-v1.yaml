  /api/v1/admin/reports/{report_id}/export-docx:
    post:
      operationId: exportAdminReportDocx
      tags: [Admin Reports]
      description: >-
        The same deterministic bytes as the employee export, for any report,
        under a *distinct* `report.exported_by_admin` audit action. Requires
        Admin role and active elevation; a regular User receives a concealed
        404. `revision` is required and positive and is never inferred or read
        from a body.
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { $ref: "#/components/parameters/ExportRevision" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Deterministic Word document for the named immutable revision
          headers:
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
            Digest: { $ref: "#/components/headers/Digest" }
            X-Export-ID: { $ref: "#/components/headers/XExportId" }
            X-Report-Revision: { $ref: "#/components/headers/XReportRevision" }
            X-Template-Version: { $ref: "#/components/headers/XTemplateVersion" }
            X-Request-ID: { $ref: "#/components/headers/XRequestId" }
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AdminElevationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/reports/bulk-export:
    post:
      operationId: bulkExportAdminReports
      tags: [Admin Reports]
      description: >-
        Export up to 100 report revisions as one deterministic ZIP containing
        each authorized document plus a sorted-key `manifest.json`. Requires
        Admin role, active elevation, a purpose-scoped single-use
        `bulk_export` step-up token, an `Idempotency-Key`, and a reason.
        Exactly one closed selection branch is accepted and
        `revision_selection` has the single release-1 value
        `current_at_request` -- no client-supplied limit and no floating
        "latest". The selection is resolved and persisted inside one
        repeatable-read transaction *before* any document is generated: zero
        matches is `404 not_found`, more than 100 is `409
        bulk_export_limit_exceeded` with no partial archive produced. The
        manifest carries report/revision/export identifiers, hashes, the actor
        id, the persisted idempotency timestamp, explicit failures, the reason,
        and normalized filter *names* -- never filter values. A failure after
        the selection is bounded stays explicit in the manifest and is never
        recorded as exported.
      parameters:
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBulkExportRequest" }
            examples:
              report_ids:
                value:
                  selection:
                    mode: report_ids
                    report_ids: [00000000-0000-4000-8000-000000000041]
                  revision_selection: current_at_request
                  reason: Fictional records request fixture.
              filters:
                value:
                  selection:
                    mode: filters
                    filters: { status: completed }
                  revision_selection: current_at_request
                  reason: Fictional records request fixture.
      responses:
        "200":
          description: Bounded ZIP archive of exported revisions plus its manifest
          headers:
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
            Digest: { $ref: "#/components/headers/Digest" }
            X-Export-ID: { $ref: "#/components/headers/XExportId" }
            X-Template-Version: { $ref: "#/components/headers/XTemplateVersion" }
            X-Request-ID: { $ref: "#/components/headers/XRequestId" }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/BulkExportConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/overview:
    get:
