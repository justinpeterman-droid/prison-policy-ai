        new_preparer_staff_id:
          oneOf:
            - { $ref: "#/components/schemas/Uuid" }
            - { type: "null" }
        reason: { type: string, minLength: 1, maxLength: 500 }
      example:
        new_owner_staff_id: 00000000-0000-4000-8000-000000000023
        reason: Fictional reassignment for shift coverage.
    AdminReportSearchItem:
      type: object
      additionalProperties: false
      required:
        - report_id
        - incident_id
        - report_type
        - status
        - category
        - facility
        - location
        - shift
        - incident_date
        - reporting_staff_member_id
        - prepared_by_staff_member_id
        - last_editor_staff_member_id
        - inmate_adc_numbers
        - current_revision_number
        - created_at
        - updated_at
      properties:
        report_id: { $ref: "#/components/schemas/Uuid" }
        incident_id: { $ref: "#/components/schemas/Uuid" }
        report_type: { type: string, enum: [first_person, supervisor_summary, cover_letter, disciplinary, investigation, form_005] }
        status: { type: string, enum: [in_progress, completed, archived] }
        category: { type: [string, "null"], maxLength: 120 }
        facility: { type: [string, "null"], maxLength: 120 }
        location: { type: [string, "null"], maxLength: 200 }
        shift: { type: [string, "null"], maxLength: 32 }
        incident_date: { type: [string, "null"], format: date }
        reporting_staff_member_id: { $ref: "#/components/schemas/Uuid" }
        prepared_by_staff_member_id: { $ref: "#/components/schemas/Uuid" }
        last_editor_staff_member_id: { $ref: "#/components/schemas/Uuid" }
        inmate_adc_numbers:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 64 }
        current_revision_number: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        updated_at: { $ref: "#/components/schemas/UtcTimestamp" }
    AdminReportSearchData:
      type: object
