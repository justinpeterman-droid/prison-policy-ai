        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/reports/{report_id}/restore:
    post:
      operationId: restoreAdminReportRevision
      tags: [Admin Reports]
      description: >-
        Exactly `{"revision_number": 7}`. Requires the purpose-scoped,
        single-use `X-Admin-Step-Up` token for `report_restore`. Calls the
        shared `restore_report()` service to create a new `restored`
        revision referencing the immutable source; no revision is ever
        overwritten, deleted, or renumbered.
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRestoreRequest" }
            example: { revision_number: 7 }
      responses:
        "200": { description: Historical snapshot copied into a new current revision, content: { application/json: { schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Safe report mutation conflict; no report content is returned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReportRevisionConflictEnvelope"
                  - $ref: "#/components/schemas/ReportIdempotencyConflictEnvelope"
                  - $ref: "#/components/schemas/ReportRequestInProgressEnvelope"
                  - $ref: "#/components/schemas/ClientUpgradeRequiredEnvelope"
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/admin/reports/{report_id}/transfer:
    post:
      operationId: transferAdminReportOwnership
      tags: [Admin Reports]
      description: >-
        Requires the purpose-scoped, single-use `X-Admin-Step-Up` token for
        `report_transfer`. Verifies both targets are active staff, locks the
        affected rows, replaces owner/preparer access transactionally, and
        appends an `ownership_change` revision plus a
        `report.ownership_transferred` audit event.
      parameters:
        - { $ref: "#/components/parameters/ReportId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/XAdminStepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReportTransferRequest" }
      responses:
        "200": { description: Ownership transferred and one ownership revision appended, content: { application/json: { schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Safe report mutation conflict; no report content is returned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReportRevisionConflictEnvelope"
                  - $ref: "#/components/schemas/ReportIdempotencyConflictEnvelope"
                  - $ref: "#/components/schemas/ReportRequestInProgressEnvelope"
                  - $ref: "#/components/schemas/ClientUpgradeRequiredEnvelope"
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/jobs/classify:
    post:
      operationId: submitClassifyJob
      tags: [AI Jobs]
      description: >-
        Authorizes actor+incident+base revision, claims the ID-06 idempotency
        record, and queues one classify job plus its transactional outbox row
        -- all in one transaction (`backend.jobs.service.submit_job`). RP-07's
        dispatcher/worker call the report engine; this endpoint never does.
      parameters:
        - { $ref: "#/components/parameters/IncidentId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSubmitRequest" }
      responses:
        "202": { description: Job queued, content: { application/json: { schema: { $ref: "#/components/schemas/JobSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/JobSubmissionConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/jobs/extract:
    post:
      operationId: submitExtractJob
      tags: [AI Jobs]
      description: Same one-transaction submission contract as `submitClassifyJob`, for job_type extract.
      parameters:
        - { $ref: "#/components/parameters/IncidentId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSubmitRequest" }
      responses:
        "202": { description: Job queued, content: { application/json: { schema: { $ref: "#/components/schemas/JobSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/JobSubmissionConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/jobs/generate:
    post:
      operationId: submitGenerateJob
      tags: [AI Jobs]
      description: Same one-transaction submission contract as `submitClassifyJob`, for job_type generate.
      parameters:
        - { $ref: "#/components/parameters/IncidentId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSubmitRequest" }
      responses:
        "202": { description: Job queued, content: { application/json: { schema: { $ref: "#/components/schemas/JobSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/JobSubmissionConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/jobs/disciplinary:
    post:
      operationId: submitDisciplinaryJob
      tags: [AI Jobs]
      description: Same one-transaction submission contract as `submitClassifyJob`, for job_type disciplinary.
      parameters:
        - { $ref: "#/components/parameters/IncidentId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobSubmitRequest" }
      responses:
        "202": { description: Job queued, content: { application/json: { schema: { $ref: "#/components/schemas/JobSuccessEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/JobSubmissionConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJobStatus
      tags: [AI Jobs]
      description: >-
        Readable only by the requesting actor with current live incident
        access, or an Admin; any other caller receives a concealed 404.
      parameters:
        - { $ref: "#/components/parameters/JobId" }
        - { $ref: "#/components/parameters/XClientVersion" }
        - { $ref: "#/components/parameters/XRequestId" }
      responses:
        "200":
          description: Authorized job status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/browser-handoffs/redeem:
    post:
      operationId: redeemReviewLabHandoff
      tags: [Browser Handoff]
      security: []
      parameters:
        - { $ref: "#/components/parameters/XRequestId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserHandoffRedeemRequest" }
      responses:
        "200":
          description: Handoff redeemed into an HttpOnly browser session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserHandoffRedeemSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/HandoffInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    XClientVersion:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/RequestId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{8,128}$'
    XDeviceId:
      name: X-Device-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    XAdminStepUp:
      name: X-Admin-Step-Up
      in: header
      required: true
      schema:
        type: string
        minLength: 40
        maxLength: 512
        writeOnly: true
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Cursor" }
    StaffQuery:
      name: query
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
    StaffId:
      name: staff_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ReportId:
      name: report_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    RevisionNumber:
      name: revision_number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Quoted integer revision matching base_revision_number when supplied.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        example: '"1"'
    StaffLookupQuery:
      name: query
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 100, example: Example }
    StaffLookupLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
  headers:
    XRequestId:
      description: Validated request correlation identifier.
      schema:
        $ref: "#/components/schemas/RequestId"
  responses:
    ValidationFailed:
      description: Closed request validation failed
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidCredentials:
      description: Employee number or PIN is invalid
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SessionReauthenticationRequired:
      description: Renewal is invalid and a new sign-in is required
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Authentication rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          description: Seconds until every exceeded login dimension is safe to retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DependencyUnavailable:
      description: Authentication persistence dependency is unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    AuthenticationRequired:
      description: A valid live bearer session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflict:
      description: Mutation conflict; code is idempotency_conflict, request_in_progress, idempotent_response_unavailable, client_upgrade_required, duplicate_employee_number, account_already_exists, last_active_admin, or account_conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PinChangeRequired:
      description: The temporary PIN must be changed before this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdminElevationRequired:
      description: Admin authorization failed; code is permission_denied, pin_change_required, or admin_elevation_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    StepUpRequired:
      description: Admin authorization failed; code is permission_denied, pin_change_required, admin_elevation_required, or step_up_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RevisionOrIdempotencyConflict:
      description: Revision or idempotency conflict; code is revision_conflict, idempotency_conflict, request_in_progress, or client_upgrade_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    JobSubmissionConflict:
      description: Job submission conflict; code is revision_conflict, idempotency_conflict, request_in_progress, or job_result_conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          examples:
            idempotency_conflict:
              value: { error: { code: idempotency_conflict, message: The idempotency key was already used for a different fictional request., retryable: false }, request_id: req_20260812_job_idempotency_conflict, server_time: "2026-08-12T15:10:01Z", api_version: v1 }
            revision_conflict:
              value: { error: { code: revision_conflict, message: The incident changed; reload before submitting., retryable: false, details: { current_revision_number: 2 } }, request_id: req_20260812_job_revision_conflict, server_time: "2026-08-12T15:10:01Z", api_version: v1 }
            job_result_conflict:
              value: { error: { code: job_result_conflict, message: "the incident changed since the job was queued; current revision is 2", retryable: false }, request_id: req_20260812_job_result_conflict, server_time: "2026-08-12T15:10:01Z", api_version: v1 }
    ReportRevisionConflict:
      description: Safe report conflict metadata only; no report content is returned
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReportRevisionConflictEnvelope" }
          examples:
            stale_save:
              value:
                error:
                  code: revision_conflict
                  message: The fictional report changed; reload before saving.
                  retryable: false
                  details:
                    current_revision_number: 7
                    current_editor_display_name: Officer Alex Example
                    current_edited_at: "2026-08-12T15:10:00Z"
                    changed_fields: [narrative]
                request_id: req_20260812_report_conflict
                server_time: "2026-08-12T15:10:01Z"
                api_version: v1
    BlockingInformationRequired:
      description: Required incident information is unresolved; code is blocking_information_required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    HandoffInvalid:
      description: The one-time handoff is invalid, expired, or already redeemed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9_-]{8,64}$'
      example: request_20260812_000001
    UtcTimestamp:
      type: string
      format: date-time
      minLength: 1
      example: '2026-08-12T18:30:00Z'
    Uuid:
      type: string
      format: uuid
      minLength: 1
      example: 00000000-0000-4000-8000-000000000001
    Cursor:
      type: string
      minLength: 40
      maxLength: 512
    FictionalEmployeeNumber:
      type: string
      example: TEST-1001
    OpaqueToken:
      type: string
      example: example-token-not-valid
    LoginRequest:
      type: object
      additionalProperties: false
      required: [employee_number, pin, device_id, device_label, persistent]
      properties:
        employee_number:
          $ref: "#/components/schemas/FictionalEmployeeNumber"
        pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Z9Y8X7
        device_id:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
          example: device-fictional-user-0001
        device_label:
          type: string
          minLength: 1
          maxLength: 120
          example: Fictional Intake Desk
        persistent:
          type: boolean
          example: false
    RenewRequest:
      type: object
      additionalProperties: false
      required: [renewal_token, device_id]
      properties:
        renewal_token:
          type: string
          minLength: 40
          maxLength: 512
          writeOnly: true
          example: example-renewal-token-not-valid
        device_id:
          type: string
          minLength: 16
          maxLength: 256
          writeOnly: true
          example: device-fictional-user-0001
    ChangePinRequest:
      type: object
      additionalProperties: false
      required: [current_pin, new_pin]
      properties:
        current_pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Z9Y8X7
        new_pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
          example: Q7W9E2
    SessionProfile:
      type: object
      additionalProperties: false
      required: [staff_id, employee_number, display_name, rank, shift, role, status]
      properties:
        staff_id:
          $ref: "#/components/schemas/Uuid"
        employee_number:
          $ref: "#/components/schemas/FictionalEmployeeNumber"
        display_name:
          type: string
          example: Officer Avery Morgan
        rank:
          type: string
          example: Officer
        shift:
          type: string
          example: A
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, locked, deactivated]
    SessionTokenData:
      type: object
      additionalProperties: false
      required:
        - session_id
        - access_token
        - renewal_token
        - access_expires_at
        - renewal_expires_at
        - persistent
        - requires_pin_change
        - profile
      properties:
        session_id:
          $ref: "#/components/schemas/Uuid"
        access_token:
          $ref: "#/components/schemas/OpaqueToken"
        renewal_token:
          $ref: "#/components/schemas/OpaqueToken"
        access_expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
        renewal_expires_at:
          $ref: "#/components/schemas/UtcTimestamp"
        persistent:
          type: boolean
        requires_pin_change:
          type: boolean
        profile:
          $ref: "#/components/schemas/SessionProfile"
    AuthSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          $ref: "#/components/schemas/SessionTokenData"
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    GenericSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, server_time, api_version]
      properties:
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
        request_id:
          $ref: "#/components/schemas/RequestId"
        server_time:
          $ref: "#/components/schemas/UtcTimestamp"
        api_version:
          type: string
          const: v1
    MeData:
      type: object
      additionalProperties: false
      required: [account_id, staff_id, session_id, employee_number, display_name, rank, shift, role, status, must_change_pin]
      properties:
        account_id: { $ref: "#/components/schemas/Uuid" }
        staff_id: { $ref: "#/components/schemas/Uuid" }
        session_id: { $ref: "#/components/schemas/Uuid" }
        employee_number: { $ref: "#/components/schemas/FictionalEmployeeNumber" }
        display_name: { type: string }
        rank: { type: string }
        shift: { type: string }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, locked, deactivated] }
        must_change_pin: { type: boolean }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, device_label, persistent, created_at, last_used_at, renewal_expires_at, current]
      properties:
        session_id: { $ref: "#/components/schemas/Uuid" }
        device_label: { type: string, maxLength: 120 }
        persistent: { type: boolean }
        created_at: { $ref: "#/components/schemas/UtcTimestamp" }
        last_used_at: { $ref: "#/components/schemas/UtcTimestamp" }
        renewal_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
        current: { type: boolean }
    LogoutData:
      type: object
      additionalProperties: false
      required: [signed_out]
      properties:
        signed_out: { type: boolean, const: true }
    LogoutAllData:
      type: object
      additionalProperties: false
      required: [signed_out_account_id, session_count]
      properties:
        signed_out_account_id: { $ref: "#/components/schemas/Uuid" }
        session_count: { type: integer, minimum: 0 }
    SessionRevokeData:
      type: object
      additionalProperties: false
      required: [session_id, revoked]
      properties:
        session_id: { $ref: "#/components/schemas/Uuid" }
        revoked: { type: boolean, const: true }
    MeSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/MeData" }
    LogoutSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LogoutData" }
    LogoutAllSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/LogoutAllData" }
    SessionListSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/SessionSummary" }
    SessionRevokeSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/GenericSuccessEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SessionRevokeData" }
    AdminPurpose:
      type: string
      enum: [admin_center, staff_write, account_create, account_role_status, account_reset_pin, account_unlock, account_revoke_sessions, report_restore, report_transfer, bulk_export, audit_export, review_lab_handoff]
    SensitiveAdminPurpose:
      type: string
      enum: [staff_write, account_create, account_role_status, account_reset_pin, account_unlock, account_revoke_sessions, report_restore, report_transfer, bulk_export, audit_export, review_lab_handoff]
    AdminStepUpRequest:
      type: object
      additionalProperties: false
      required: [pin, purpose]
      properties:
        pin:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^[A-Za-z0-9]{4,8}$'
          writeOnly: true
        purpose: { $ref: "#/components/schemas/AdminPurpose" }
    AdminElevationData:
      type: object
      additionalProperties: false
      required: [purpose, elevation_expires_at]
      properties:
        purpose: { const: admin_center }
        elevation_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
    AdminPurposeTokenData:
      type: object
      additionalProperties: false
      required: [purpose, elevation_expires_at, step_up_token, step_up_expires_at]
      properties:
        purpose: { $ref: "#/components/schemas/SensitiveAdminPurpose" }
        elevation_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
        step_up_token: { type: string, minLength: 40, maxLength: 512, writeOnly: true }
        step_up_expires_at: { $ref: "#/components/schemas/UtcTimestamp" }
    AdminStepUpSuccessEnvelope:
      allOf:
