      example:
        mode: filters
        filters: { status: completed }
    AdminBulkExportRequest:
      type: object
      additionalProperties: false
      required: [selection, revision_selection, reason]
      properties:
        selection:
          oneOf:
            - { $ref: "#/components/schemas/AdminBulkExportSelectionByIds" }
            - { $ref: "#/components/schemas/AdminBulkExportSelectionByFilters" }
        revision_selection:
          type: string
          const: current_at_request
          description: >-
            The sole release-1 value. A floating "latest" is rejected, as is
            any client-supplied document limit.
        reason: { type: string, minLength: 1, maxLength: 500 }
      example:
        selection:
          mode: filters
          filters: { status: completed }
        revision_selection: current_at_request
        reason: Fictional records request fixture.
