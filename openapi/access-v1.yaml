openapi: 3.1.0
info:
  title: Prison Policy Access API
  version: 1.0.0
  description: Versioned API for the managed Microsoft Access client.
tags:
  - name: Authentication
  - name: Self
  - name: Admin Staff
  - name: Admin Accounts
  - name: Browser Handoff
  - name: Staff
  - name: Incidents
  - name: Reports
  - name: Admin Reports
  - name: AI Jobs
  - name: Policy Expert
security:
  - AccessBearer: []
paths:
  /api/v1/client-policy:
    get:
      operationId: getClientPolicy
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Current Access compatibility policy
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/staff:
    get:
      operationId: searchActiveStaff
      tags: [Staff]
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/StaffLookupQuery"
        - $ref: "#/components/parameters/StaffLookupLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Bounded active staff matches for report selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffLookupSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PinChangeRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents:
    post:
      operationId: createIncident
      tags: [Incidents]
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentCreateRequest" }
      responses:
        "201":
          description: Canonical incident workspace and revision one created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PinChangeRequired" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/BlockingInformationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}:
    get:
      operationId: getIncident
      tags: [Incidents]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Authorized incident workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    patch:
      operationId: saveIncident
      tags: [Incidents]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentSaveRequest" }
      responses:
        "200":
          description: Incident revision appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RevisionOrIdempotencyConflict" }
        "422": { $ref: "#/components/responses/BlockingInformationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/revisions:
    get:
      operationId: listIncidentRevisions
      tags: [Incidents]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Authorized immutable incident revision summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentRevisionListSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/revisions/{revision_number}:
    get:
      operationId: getIncidentRevision
      tags: [Incidents]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/RevisionNumber"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Authorized immutable incident revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentRevisionSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/restore:
    post:
      operationId: restoreIncidentRevision
      tags: [Incidents]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentRestoreRequest" }
      responses:
        "200":
          description: Historical incident content copied into a new current revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RevisionOrIdempotencyConflict" }
        "422": { $ref: "#/components/responses/BlockingInformationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/jobs/classify:
    post:
      operationId: submitClassificationJob
      tags: [AI Jobs]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/RequiredXRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitJobRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PinChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/JobSubmissionConflict" }
        "422": { $ref: "#/components/responses/BlockingInformationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/jobs/extract:
    post:
      operationId: submitExtractionJob
      tags: [AI Jobs]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/RequiredXRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitJobRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PinChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/JobSubmissionConflict" }
        "422": { $ref: "#/components/responses/BlockingInformationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/jobs/generate:
    post:
      operationId: submitGenerationJob
      tags: [AI Jobs]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/RequiredXRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitJobRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PinChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/JobSubmissionConflict" }
        "422": { $ref: "#/components/responses/BlockingInformationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/incidents/{incident_id}/jobs/disciplinary:
    post:
      operationId: submitDisciplinaryJob
      tags: [AI Jobs]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/RequiredXRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitJobRequest" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PinChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/JobSubmissionConflict" }
        "422": { $ref: "#/components/responses/BlockingInformationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/jobs/{job_id}:
    get:
      operationId: getAiJob
      tags: [AI Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/RequiredXRequestId"
      responses:
        "200":
          description: Requester-and-current-access or Admin job status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSuccessEnvelope" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PinChangeRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/reports:
    get:
      operationId: listEmployeeReports
      tags: [Reports]
      description: Authorization-scoped owned or prepared report summaries; report content is excluded.
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - name: relationship
          in: query
          required: true
          schema: { type: string, enum: [owned, prepared] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [in_progress, completed, archived] }
        - name: incident_date_from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: incident_date_to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: category
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: updated_at_from
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UtcTimestamp" }
        - name: updated_at_to
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UtcTimestamp" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Authorized fictional report queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportListSuccessEnvelope" }
              examples:
                owned:
                  value:
                    data:
                      items:
                        - report_id: 00000000-0000-4000-8000-000000000041
                          incident_id: 00000000-0000-4000-8000-000000000031
                          report_type: first_person
                          relationship: owned
                          reporting_staff_member_id: 00000000-0000-4000-8000-000000000021
                          reporting_officer_display_name: Officer Alex Example
                          prepared_by_staff_member_id: 00000000-0000-4000-8000-000000000022
                          preparer_display_name: Officer Blair Example
                          category: fictional_incident
                          incident_date: "2026-08-12"
                          status: in_progress
                          updated_at: "2026-08-12T15:00:00Z"
                          current_revision_number: 1
                      next_cursor: example-report-cursor-fictional-not-valid-0000000001
                    request_id: req_20260812_report_list
                    server_time: "2026-08-12T15:00:01Z"
                    api_version: v1
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/reports/{report_id}:
    get:
      operationId: getEmployeeReport
      tags: [Reports]
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Authorized canonical fictional report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" }
              examples:
                detail: { value: { data: { report_id: 00000000-0000-4000-8000-000000000041, incident_id: 00000000-0000-4000-8000-000000000031, report_type: first_person, status: in_progress, current_revision_number: 2, content: { schema_version: 1, narrative: "Fictional authorized narrative.", editable_fields: {}, validation: {}, warnings: [] }, reporting_staff_member_id: 00000000-0000-4000-8000-000000000021, reporting_officer_display_name: "Officer Alex Example", prepared_by_staff_member_id: 00000000-0000-4000-8000-000000000022, preparer_display_name: "Officer Blair Example", last_editor_staff_member_id: 00000000-0000-4000-8000-000000000022, last_editor_display_name: "Officer Blair Example", created_at: "2026-08-12T15:00:00Z", updated_at: "2026-08-12T15:05:00Z" }, request_id: req_20260812_report_detail, server_time: "2026-08-12T15:05:01Z", api_version: v1 } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    patch:
      operationId: saveEmployeeReport
      tags: [Reports]
      description: Save content or make one reversible status change; Completed and Archived remain editable.
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ReportSaveRequest"
                - $ref: "#/components/schemas/ReportStatusSaveRequest"
      responses:
        "200":
          description: Fictional report content or status revision appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" }
              examples:
                saved: { value: { data: { report_id: 00000000-0000-4000-8000-000000000041, incident_id: 00000000-0000-4000-8000-000000000031, report_type: first_person, status: completed, current_revision_number: 3, content: { schema_version: 1, narrative: "Fictional saved narrative.", editable_fields: {}, validation: {}, warnings: [] }, reporting_staff_member_id: 00000000-0000-4000-8000-000000000021, reporting_officer_display_name: "Officer Alex Example", prepared_by_staff_member_id: 00000000-0000-4000-8000-000000000022, preparer_display_name: "Officer Blair Example", last_editor_staff_member_id: 00000000-0000-4000-8000-000000000021, last_editor_display_name: "Officer Alex Example", created_at: "2026-08-12T15:00:00Z", updated_at: "2026-08-12T15:06:00Z" }, request_id: req_20260812_report_save, server_time: "2026-08-12T15:06:01Z", api_version: v1 } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Safe report mutation conflict; no report content is returned
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReportRevisionConflictEnvelope"
                  - $ref: "#/components/schemas/ReportIdempotencyConflictEnvelope"
                  - $ref: "#/components/schemas/ReportRequestInProgressEnvelope"
                  - $ref: "#/components/schemas/ClientUpgradeRequiredEnvelope"
              examples:
                revision_conflict:
                  value:
                    error:
                      code: revision_conflict
                      message: The fictional report changed; reload before saving.
                      retryable: false
                      details:
                        current_revision_number: 7
                        current_editor_display_name: Officer Alex Example
                        current_edited_at: "2026-08-12T15:10:00Z"
                        changed_fields: [narrative]
                    request_id: req_20260812_report_conflict
                    server_time: "2026-08-12T15:10:01Z"
                    api_version: v1
                idempotency_conflict:
                  value: { error: { code: idempotency_conflict, message: The idempotency key was already used for a different fictional request., retryable: false }, request_id: req_20260812_idempotency_conflict, server_time: "2026-08-12T15:10:01Z", api_version: v1 }
                request_in_progress:
                  value: { error: { code: request_in_progress, message: The matching fictional request is still in progress., retryable: true }, request_id: req_20260812_request_in_progress, server_time: "2026-08-12T15:10:01Z", api_version: v1 }
                client_upgrade_required:
                  value: { error: { code: client_upgrade_required, message: Upgrade the fictional client before saving., retryable: false }, request_id: req_20260812_client_upgrade, server_time: "2026-08-12T15:10:01Z", api_version: v1 }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/reports/{report_id}/revisions:
    get:
      operationId: listEmployeeReportRevisions
      tags: [Reports]
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Authorized immutable fictional revision summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportRevisionListSuccessEnvelope" }
              examples:
                history: { value: { data: { items: [{ revision_id: 00000000-0000-4000-8000-000000000051, revision_number: 1, reason: manual_save, changed_fields: [narrative], editor_staff_member_id: 00000000-0000-4000-8000-000000000022, editor_display_name: "Officer Blair Example", client_version: 1.0.0, created_at: "2026-08-12T15:00:00Z", source_revision_number: null, is_current: false }], next_cursor: null }, request_id: req_20260812_report_history, server_time: "2026-08-12T15:07:00Z", api_version: v1 } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/reports/{report_id}/revisions/{revision_number}:
    get:
      operationId: getEmployeeReportRevision
      tags: [Reports]
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/RevisionNumber"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Authorized immutable fictional report revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportRevisionSuccessEnvelope" }
              examples:
                revision: { value: { data: { revision_id: 00000000-0000-4000-8000-000000000051, revision_number: 1, reason: manual_save, changed_fields: [narrative], editor_staff_member_id: 00000000-0000-4000-8000-000000000022, editor_display_name: "Officer Blair Example", client_version: 1.0.0, created_at: "2026-08-12T15:00:00Z", source_revision_number: null, is_current: false, content: { schema_version: 1, narrative: "Fictional immutable narrative.", editable_fields: {}, validation: {}, warnings: [] } }, request_id: req_20260812_report_revision, server_time: "2026-08-12T15:07:00Z", api_version: v1 } }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/reports/{report_id}/restore:
    post:
      operationId: restoreEmployeeReportRevision
      tags: [Reports]
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRestoreRequest" }
      responses:
        "200":
          description: Fictional historical snapshot copied to a new current revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSuccessEnvelope" }
              examples:
                restored: { value: { data: { report_id: 00000000-0000-4000-8000-000000000041, incident_id: 00000000-0000-4000-8000-000000000031, report_type: first_person, status: in_progress, current_revision_number: 4, content: { schema_version: 1, narrative: "Fictional restored narrative.", editable_fields: {}, validation: {}, warnings: [] }, reporting_staff_member_id: 00000000-0000-4000-8000-000000000021, reporting_officer_display_name: "Officer Alex Example", prepared_by_staff_member_id: 00000000-0000-4000-8000-000000000022, preparer_display_name: "Officer Blair Example", last_editor_staff_member_id: 00000000-0000-4000-8000-000000000021, last_editor_display_name: "Officer Alex Example", created_at: "2026-08-12T15:00:00Z", updated_at: "2026-08-12T15:08:00Z" }, request_id: req_20260812_report_restore, server_time: "2026-08-12T15:08:01Z", api_version: v1 } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RevisionOrIdempotencyConflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /api/v1/reports/{report_id}/recovery-revisions:
    post:
      operationId: createEmployeeReportRecoveryRevision
      tags: [Reports]
      description: Preserve local content as a separate revision without promoting it over current cloud content.
