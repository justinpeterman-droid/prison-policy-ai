openapi: 3.1.0
info:
  title: Guided Operations Officer Utilities API
  version: 0.1.0
  description: >-
    Cookie-authenticated same-origin APIs for the real officer Home dashboard,
    approved Forms Library, NCU Days Count, and shared administrator paperwork
    foundation. Identity credentials and operational narratives are never
    returned by these endpoints.
servers:
  - url: /api/web/v1
security:
  - BrowserSession: []
paths:
  /home:
    get:
      operationId: getOfficerHomeSummary
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: shift
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "200":
          description: Authorization-scoped, content-free officer Home metadata
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /forms-library:
    get:
      operationId: listApprovedForms
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: output_kind
          in: query
          schema: { type: string, enum: [digital_document, physical_only] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Sanitized approved form metadata and server-enforced actions
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /count-sheet/definition:
    get:
      operationId: getNcuCountDefinition
      responses:
        "200":
          description: Reviewed count rows, columns, and definition fingerprint
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "503":
          description: The reviewed official count template is not published or unavailable
  /count-sheet:
    get:
      operationId: getNcuCountByDateShift
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: shift
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "200":
          description: Existing Count Sheet or an explicit null item
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    post:
      operationId: createNcuCount
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCountSheetRequest"
      responses:
        "201": { description: Count Sheet and revision one created }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /count-sheet/{record_id}:
    patch:
      operationId: saveNcuCountRevision
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCountSheetRequest"
      responses:
        "200": { description: New immutable Count Sheet revision appended }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /paperwork:
    get:
      operationId: getAdminOperationalPaperworkByIdentity
      description: Administrator-only generic store adapter; officers use form-specific APIs.
      responses:
        "200": { description: Matching administrator paperwork or null }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      operationId: createAdminOperationalPaperwork
      description: Administrator-only generic store adapter.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: Administrator paperwork created }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /paperwork/{record_id}:
    get:
      operationId: getAdminOperationalPaperwork
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200": { description: Administrator paperwork record }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: saveAdminOperationalPaperwork
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { description: Administrator paperwork revision appended }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
  /paperwork/{record_id}/revisions:
    get:
      operationId: listAdminOperationalPaperworkRevisions
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200": { description: Immutable revision summaries }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
  /paperwork/{record_id}/restore:
    post:
      operationId: restoreAdminOperationalPaperwork
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { description: Historical content restored as a new revision }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: slut_web_access
  parameters:
    RecordId:
      name: record_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 20, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  schemas:
    CountValues:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
          maximum: 99999
    CreateCountSheetRequest:
      type: object
      additionalProperties: false
      required: [record_date, shift, values, expected_operational_total]
      properties:
        record_date: { type: string, format: date }
        shift: { type: string, minLength: 1, maxLength: 32 }
        values: { $ref: "#/components/schemas/CountValues" }
        expected_operational_total:
          type: integer
          minimum: 0
          maximum: 99999
    SaveCountSheetRequest:
      type: object
      additionalProperties: false
      required: [values, expected_operational_total, base_revision_number, reason]
      properties:
        values: { $ref: "#/components/schemas/CountValues" }
        expected_operational_total:
          type: integer
          minimum: 0
          maximum: 99999
        base_revision_number:
          type: integer
          minimum: 1
        reason:
          type: string
          enum: [autosave, manual_save]
  responses:
    ValidationFailed:
      description: Request validation failed
    AuthenticationRequired:
      description: Individual browser authentication is required
    CsrfFailed:
      description: Same-origin or CSRF validation failed
    PermissionDenied:
      description: The authenticated account lacks the required role
    NotFound:
      description: The record is absent or concealed by authorization
    Conflict:
      description: Identity, idempotency, or revision conflict
    DependencyUnavailable:
      description: A required dependency is unavailable
