openapi: 3.1.0
info:
  title: Guided Operations Web API
  version: 0.2.0
servers:
- url: /api/web/v1
security:
- BrowserSession: []
paths:
  /auth/session:
    get:
      operationId: getBrowserSession
      responses:
        '200':
          description: Request completed
      security: []
  /auth/login:
    post:
      operationId: loginBrowserSession
      responses:
        '200':
          description: Request completed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/renew:
    post:
      operationId: renewBrowserSession
      responses:
        '200':
          description: Request completed
  /auth/logout:
    post:
      operationId: logoutBrowserSession
      responses:
        '200':
          description: Request completed
  /staff:
    get:
      operationId: searchBrowserStaff
      responses:
        '200':
          description: Request completed
  /incidents:
    get:
      operationId: listBrowserIncidents
      responses:
        '200':
          description: Request completed
    post:
      operationId: createBrowserIncident
      responses:
        '200':
          description: Request completed
  /incidents/{incident_id}:
    get:
      operationId: getBrowserIncident
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
    patch:
      operationId: saveBrowserIncident
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
  /incidents/{incident_id}/revisions:
    get:
      operationId: listBrowserIncidentRevisions
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
  /incidents/{incident_id}/revisions/{revision_number}:
    get:
      operationId: getBrowserIncidentRevision
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
      - name: revision_number
        in: path
        required: true
        schema: &id003
          type: integer
          minimum: 1
  /incidents/{incident_id}/restore:
    post:
      operationId: restoreBrowserIncidentRevision
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
  /incidents/{incident_id}/reports:
    get:
      operationId: listBrowserIncidentReports
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
  /incidents/{incident_id}/jobs/{job_type}:
    post:
      operationId: submitBrowserIncidentJob
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
      - name: job_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - classify
          - extract
          - generate
          - disciplinary
  /jobs/{job_id}:
    get:
      operationId: getBrowserJob
      responses:
        '200':
          description: Request completed
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /reports/{report_id}:
    get:
      operationId: getBrowserReport
      responses:
        '200':
          description: Request completed
      parameters:
      - name: report_id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
    patch:
      operationId: saveBrowserReport
      responses:
        '200':
          description: Request completed
      parameters:
      - name: report_id
        in: path
        required: true
        schema: *id002
  /reports/{report_id}/revisions:
    get:
      operationId: listBrowserReportRevisions
      responses:
        '200':
          description: Request completed
      parameters:
      - name: report_id
        in: path
        required: true
        schema: *id002
  /reports/{report_id}/revisions/{revision_number}:
    get:
      operationId: getBrowserReportRevision
      responses:
        '200':
          description: Request completed
      parameters:
      - name: report_id
        in: path
        required: true
        schema: *id002
      - name: revision_number
        in: path
        required: true
        schema: *id003
  /reports/{report_id}/restore:
    post:
      operationId: restoreBrowserReportRevision
      responses:
        '200':
          description: Request completed
      parameters:
      - name: report_id
        in: path
        required: true
        schema: *id002
  /reports/{report_id}/export-docx:
    post:
      operationId: exportBrowserReportDocx
      responses:
        '200':
          description: Request completed
      parameters:
      - name: report_id
        in: path
        required: true
        schema: *id002
  /forms/catalog:
    get:
      operationId: listBrowserFormCatalog
      responses:
        '200':
          description: Request completed
  /incidents/{incident_id}/packet:
    get:
      operationId: getBrowserIncidentPacket
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
  /incidents/{incident_id}/packet/rebuild:
    post:
      operationId: rebuildBrowserIncidentPacket
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
  /incidents/{incident_id}/packet/additional:
    post:
      operationId: addBrowserIncidentPacketForm
      responses:
        '200':
          description: Request completed
      parameters:
      - name: incident_id
        in: path
        required: true
        schema: *id001
  /packet-items/{packet_item_id}:
    patch:
      operationId: updateBrowserPacketItem
      responses:
        '200':
          description: Request completed
      parameters:
      - name: packet_item_id
        in: path
        required: true
        schema: &id004
          type: string
          format: uuid
  /packet-items/{packet_item_id}/populate:
    post:
      operationId: populateBrowserPacketItem
      responses:
        '200':
          description: Request completed
      parameters:
      - name: packet_item_id
        in: path
        required: true
        schema: *id004
  /packet-items/{packet_item_id}/physical:
    get:
      operationId: getBrowserPhysicalPaperwork
      responses:
        '200':
          description: Request completed
      parameters:
      - name: packet_item_id
        in: path
        required: true
        schema: *id004
  /packet-items/{packet_item_id}/physical/acknowledgment:
    post:
      operationId: acknowledgeBrowserPhysicalPaperwork
      responses:
        '200':
          description: Request completed
      parameters:
      - name: packet_item_id
        in: path
        required: true
        schema: *id004
    delete:
      operationId: clearBrowserPhysicalPaperwork
      responses:
        '200':
          description: Request completed
      parameters:
      - name: packet_item_id
        in: path
        required: true
        schema: *id004
  /form-instances/{form_instance_id}:
    get:
      operationId: getBrowserFormInstance
      responses:
        '200':
          description: Request completed
      parameters:
      - name: form_instance_id
        in: path
        required: true
        schema: &id005
          type: string
          format: uuid
    patch:
      operationId: saveBrowserFormInstance
      responses:
        '200':
          description: Request completed
      parameters:
      - name: form_instance_id
        in: path
        required: true
        schema: *id005
  /form-instances/{form_instance_id}/preview:
    get:
      operationId: previewBrowserFormInstance
      responses:
        '200':
          description: Request completed
      parameters:
      - name: form_instance_id
        in: path
        required: true
        schema: *id005
  /document-actions:
    post:
      operationId: recordBrowserDocumentAction
      responses:
        '200':
          description: Request completed
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: slut_web_access
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - employee_number
      - pin
      - persistent
      properties:
        employee_number:
          type: string
        pin:
          type: string
        persistent:
          type: boolean
    SessionProfile:
      type: object
      additionalProperties: false
      properties:
        account_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        employee_number:
          type: string
        display_name:
          type: string
        rank:
          type:
          - string
          - 'null'
        shift:
          type:
          - string
          - 'null'
        role:
          type: string
        must_change_pin:
          type: boolean
