[pytest]
# Only the fast, credential-free unit tests. The GCP-backed pipeline harness
# (tests/test_pipeline.py) and one-off scripts are intentionally excluded —
# they require Vertex AI ADC and are run manually.
testpaths = tests/unit
python_files = test_*.py
python_functions = test_*
markers =
    access_com: Windows-only Microsoft Access COM integration test
